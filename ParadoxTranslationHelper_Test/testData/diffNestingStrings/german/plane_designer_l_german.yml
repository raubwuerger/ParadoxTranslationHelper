 early_bombs:0 "Aircraft Bombs"
 early_bombs_desc:0 "Since the early days of the Great War, airplanes have been increasingly used to drop explosives onto enemy targets. Over time, this has developed more and more into a fundamental aspect of aerial warfare."
 heavy_bombs:0 "Heavy Bombs"
 heavy_bombs_desc:0 "Modern Warfare requires airplanes increasingly used larger bombs on enemy targets. Over time, this has developed more and more into a fundamental aspect of aerial warfare."
 armor_piercing_bombs:0 "Armor Piercing Bombs"
 armor_piercing_bombs_desc:0 "Warships have steadily increased their deck armor to defeat this specialist bombs must be developed to penetrate this armor."
 air_torpedoe_1:0 "Air Launched Torpedoes"
 air_torpedoe_1_desc:0 "lightweight torpedoes must be developed so that they can be carried by our aircraft."
 air_torpedoe_2:0 "Improved Air Launched Torpedoes"
 air_torpedoe_2_desc:0 "advances in aircraft allows up to develop larger more powerful torpedoes."
 air_torpedoe_3:0 "Advanced Air Launched Torpedoes"
 air_torpedoe_3_desc:0 "By combining the latest techknowlogies we can create highly advanced torpedoes for our aircraft."
 photo_reconnaisance:1 "Aerial Photo Reconnaissance"
 photo_reconnaisance_desc:0 "The first clear military purpose of the aeroplane was to find the enemy and report their location to the Generals on the ground. This still remains one of the most common tasks of military aviation."
 aa_lmg:0 "Airplane Light MG"
 aa_lmg_desc:0 "Rifle-caliber machine guns have formed the mainstay of air-to-air weaponry since the days of the Great War."
 survivability_studies:0 "Survivability Studies"
 survivability_studies_desc:0 "By carefully analyzing the battle damage on returning planes, we can accurately determine which parts of a plane are really vital."
 aircraft_construction:0 "Aircraft Construction"
 aircraft_construction_desc:0 "We have come a long way since the days of plywood and fabric in aircraft manufacture. New technologies allow for planes that are better suited for specific roles."
 aa_hmg:0 "Aircraft Heavy MG"
 aa_hmg_desc:0 "Modern planes are capable of withstanding significantly more punishment than older models, while also offering fewer opportunities to score hits. Each hit must therefore do the maximum amount of damage, requiring a bigger cartridge."
 aa_cannon_1:0 "Aircraft Cannons I"
 aa_cannon_1_desc:0 "A cannon shell can punch through even the toughest airplane, while potentially carrying enough explosives to do crippling damage when it hits."
 aa_cannon_2:0 "High Calibre Cannons"
 aa_cannon_2_desc:0 "With a higher caliber and a bigger shell, these cannons can bring down even large planes in a single hit."
 aa_cannon_3:0 "Modern Aircraft Cannons "
 aa_cannon_3_desc:0 "With A modern cannon firing a large shell at high velocity, we can bring down even the toughest aircraft."
 engines_1:0 "Aircraft Engines I"
 engines_1_desc:0 "Airplane engines must be powerful, but lightweight and reliable. This engine type provides enough power to get a plane in the air, but somewhat limits it from reaching its full potential."
 engines_2:0 "Aircraft Engines II"
 engines_2_desc:0 "The rapid growth of airplanes requires a corresponding growth of engine power."
 engines_3:0 "Aircraft Engines III"
 engines_3_desc:0 "$engine_3_1x_desc$"
 engines_4:0 "Aircraft Engines IV"
 engines_4_desc:0 "$engine_4_1x_desc$"
 range_improvements:0 "Range Improvements"
 range_improvements_desc:0 "While it seems obvious that adding more fuel capacity will increase the range of an airplane, actually adding that capacity to a plane without impacting flight performance too much is far from trivial."

 sp_centrifugal_jet_tech:0 "Centrifugal Jet"
 sp_centrifugal_jet_tech_desc:0 "Centrifugal jets use a single stage compressor to compress the intake air, before blasting it out to create thrust. This results in smaller, more easily maintained engines."
 jet_engine_axial_1x:0 "1x Axial Jet Engine"
 jet_engine_axial_1x_desc:0 "Mounting multiple compressors, one after another the Axial Engine is able to multiply the amount of thrust generated by a simple single-stage jet engine."
 jet_engine_axial_2x:0 "2x Axial Jet Engine"
 jet_engine_axial_2x_desc:0 "$engine_1_2x_desc$"
 jet_engine_axial_3x:0 "3x Axial Jet Engine"
 jet_engine_axial_3x_desc:0 "$engine_1_3x_desc$"
 jet_engine_axial_4x:0 "4x Axial Jet Engine"
