 SCA_unified_armament_industries:0 "Vereinte Rüstungsindustrie"
 SCA_unified_armament_industries_desc:0 "Unsere Vereinigung bietet die Möglichkeit, verschiedene Fabriken so zu spezialisieren, dass sie das produzieren, was sie am besten können."

