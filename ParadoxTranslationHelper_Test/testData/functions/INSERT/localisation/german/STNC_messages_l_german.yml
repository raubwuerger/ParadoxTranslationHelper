MESSAGE_TYPE_FLEET_MOTHBALLING_MESSAGE:	"Die $FLEET|H$ ist in $PLANET$ eingetroffen, um mit den §HStilllegungsarbeiten§! zu beginnen. \n\nDie Flotte wird bis zur Reaktivierung außer Betrieb sein."
