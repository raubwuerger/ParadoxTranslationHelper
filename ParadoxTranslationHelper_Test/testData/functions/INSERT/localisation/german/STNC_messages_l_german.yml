klingon_empire_leader_greeting:	"§L"Für das Imperium!"§!"
dominion_leader_greeting:	"§L"Ich lebe, um den Gründern zu dienen."§!"
stnc_default_greeting:	"§L"Ich bin hier, um den [Root.GetName] zu dienen. Sagt mir, was zu tun ist."§!"
borg_leader_greeting:	"§L"Drohne für Einsatz bereit."§!"
agimus_backstory:	"AGIMUS ist eine künstliche Intelligenz unbekannter Herkunft, manipulativ, aber hochqualifiziert."
agimus_catch_phrase:	"Wer wagt es, sich über AGIMUS lustig zu machen?"
agnes_jurati_backstory:	"§Y[This.GetName]§! ist ein führender Wissenschaftler auf dem Gebiet der Kybernetik, der für seine [This.GetHerHis] polarisierende Persönlichkeit berüchtigt ist."
agnes_jurati_catch_phrase:	"Also ... der Weltraum ist doch super langweilig. Wer hätte das gedacht?"
akellen_macet_backstory:	 "§Y[This.GetName]§! ist ein kluger und fähiger [This.Species.GetName] Offizier, der zwar patriotisch und loyal ist, aber nicht blind Befehle befolgt. Er ist aufrichtig in seinen Äußerungen und Motiven und versteht den Wert eines dauerhaften Friedens."
akellen_macet_catch_phrase:	"Es gibt Menschen, die ... sich nach Krieg sehnen. Die ihn brauchen. Ich gehöre nicht zu ihnen."
alexander_munro_backstory:	" §Y[This.GetName]§! ist ein [This.Species.GetName] Spezialist für taktische Befehlsführung, der als Pionier des Hazard-Team-Konzepts bekannt ist – einer Eliteeinheit aus Experten verschiedener Raumschiffabteilungen, die eingesetzt wird, um extreme Situationen unter Kontrolle zu bringen und risikoreiche Außenmissionen durchzuführen."
alexander_munro_catch_phrase:	"Wir sind auf den Feind gestoßen ... und er ist nicht freundlich!"
altan_soong_backstory:	"§YDr. [This.GetName]§! ist ein [This.Species.GetName] Kybernetiker und selbsternannter "verrückter Wissenschaftler". Er widmet sich der Erforschung fortgeschrittener künstlicher Lebensformen und der Bewusstseinsübertragung."
altan_soong_catch_phrase:	"Doktor Altan Inigo Soong, verrückter Wissenschaftler."
aman_evek_backstory:	"Gilt als einer der mächtigsten Offiziere im Militär [This.Species.GetName] und ist sowohl als Soldat als auch als Dichter bekannt. Unter seinem Kommando zu dienen, gilt als höchste Ehre."
aman_evek_catch_phrase:	"Über Autorität diskutieren wir später. Jetzt wirst du gehorchen."
andy_billups_backstory:	"§Y[This.GetName]§!, der unter dem Namen §Y"Andy" §!, wuchs in einer Kultur auf, die eine fantastische Version der mittelalterlichen [This.Species.GetName] Geschichte vergötterte. Als schüchterner und ruhiger Mensch wird [This.GetSheHe] als talentierter Ingenieur respektiert."
andy_billups_catch_phrase:	"Wenn Sie vorhaben, mich zum Geschlechtsverkehr zu verleiten, überlegen Sie es sich noch einmal. Die einzige Frau, die ich liebe, ist zwei Decks hoch und mit Dilithium vollgepumpt."
argelian_vrax_backstory:	"§Y[This.GetName]§! ist brillant und berechnend und hat es sich zur Aufgabe gemacht, die interstellaren Beziehungen zwischen allen regionalen Mächten zu destabilisieren, die eines Tages zu Rivalen der Nation [This.GetHerHis] werden könnten."
argelian_vrax_catch_phrase:	"Ich verspreche Ihnen, dass nicht ich für Ihr Versagen bezahlen werde."
arik_soong_backstory:	"Als einer der klügsten Köpfe auf dem Gebiet der Genetik hat §Y[This.GetName]§! mit seinen Ansichten zur Gentechnik für Kontroversen gesorgt."
arik_soong_catch_phrase:	" Wir dürfen uns nicht von Fehlern der Vergangenheit zurückhalten lassen."
arthur_robinson_backstory:	"§Y[This.GetName]§! ist ein versierter Testpilot, der als erster [This.Species.GetName] die Warp-2-Barriere durchbrochen hat."
arthur_robinson_catch_phrase:	"Wir werden niemals in den Weltraum vordringen, wenn wir auf Nummer sicher gehen."
azetbur_backstory:	" §Y[This.GetName]§!, Tochter von Gorkon, ist eine angesehene Politikerin und Gouverneurin. Sie wird von vielen als moderate Persönlichkeit mit wenigen Feinden angesehen, die in der Lage ist, viele Fraktionen unter ihrer Führung zu vereinen. [This.GetHerHis]"
azetbur_catch_phrase:	"Wir sind ein stolzes Volk, und wir sind hier, weil wir weiterhin stolz sein wollen."
balthazar_edison_backstory:	"Geboren 2136, §Y[This.GetName]§! ist ein erfahrener [This.Species.GetName] Soldat und Militärkommandant. Er glaubt, dass die Kämpfe und Verluste früherer Konflikte das Volk [This.Species.GetName] stark gemacht haben und dass die Opfer der Vergangenheit immer in Erinnerung bleiben müssen."
balthazar_edison_catch_phrase:	"Du wirst mich wahrscheinlich nie wieder sehen. Aber wenn doch ... sei bereit."
barniss_frex_backstory:	" §Y[This.GetName]§! ist ein nervöser, aber kluger [This.Species.GetName] Wissenschaftsoffizier und Kommunikationsspezialist. Bekannt dafür, dass er Ereignisse etwas übertreibt, wenn er anderen von seinen [This.GetHerHis] Heldentaten erzählt."
barniss_frex_catch_phrase:	"Oh je, schicken sie mich etwa an einen noch schlimmeren Ort?"
belanna_torres_backstory:	"Geboren 2346, §Y[This.GetName]§! ist ein talentierter Ingenieur, halb Mensch, halb [This.Species.GetName]. Er ist dünnhäutig und neigt zu gewalttätigen Ausbrüchen, aber er ist äußerst talentiert und loyal."
belanna_torres_catch_phrase:	"Nichts ist unmöglich, wenn man es nur genug will."
benjamin_sisko_backstory:	"Geboren 2332 als Sohn von Joseph und Sarah Sisko, §Y[This.GetName]§! hat eine Begabung sowohl für das Kommando als auch für das Design von Raumschiffen gezeigt."
benjamin_sisko_catch_phrase:	"Es gibt ein altes Sprichwort: Das Glück begünstigt die Mutigen. Nun, ich denke, wir werden es bald herausfinden."
betor_backstory:	"§Y[This.GetName]§!, Tochter von Ja'rod und Schwester von Lursa, ist eine manipulative und gefürchtete [This.Species.GetName] Kriegerin. Sie ist bereit, alle Grenzen zu überschreiten, um die Interessen des [This.GetHerHis] Hauses zu fördern."
betor_catch_phrase:	"Warum unser Feind sein, wenn Sie unser Freund sein können?"
beverly_crusher_backstory:	"Geboren 2324, §YDr. [This.GetName]§! ist ein erfahrener Chefarzt und ehemaliger Leiter der medizinischen Abteilung der Flotte. Ungewöhnlich für einen Arzt ist, dass [This.GetSheHe] auch ein voll zertifizierter Brückenoffizier ist."
beverly_crusher_catch_phrase:	"Warum tun Kapitäne immer so, als wären sie unsterblich?"
bradward_boimler_backstory:	"§Y"Brad" Boimler§! hat den Ruf, besonders bemüht zu sein, aber er ist ein talentierter Offizier mit großem Potenzial. Bekannt für den "Boimler-Effekt", der dazu ermutigt, Regeln zu brechen, um Ergebnisse zu erzielen."
bradward_boimler_catch_phrase:	"Ich habe mich gemeldet, um zu forschen, im Weltraum zu sein, neue Entdeckungen zu machen und friedliche diplomatische Lösungen zu finden. Das ist mutig."
bruce_maddox_backstory:	"§Y[This.GetName]§! ist ein versierter Kybernetiker, dessen Ansichten über künstliche Empfindungsfähigkeit von [This.GetHerHis] Kollegen als kontrovers angesehen werden."
bruce_maddox_catch_phrase:	"Wenn ich dieses Experiment durchführen darf, werden die Horizonte menschlicher Errungenschaften grenzenlos."
brunt_backstory:	"§Y[This.GetName]§! ist ein berüchtigt erfolgreicher und akribischer Liquidator. Er versucht ständig, [This.GetHerselfHimself] in Positionen mit größerer Macht zu manövrieren."
brunt_catch_phrase:	"Es ist nie zu früh, sich beim Chef einzuschmeicheln!"
carol_freeman_backstory:	"§Y[This.GetName]§! ist ein fähiger Offizier, handelt jedoch manchmal unüberlegt. [This.GetSheHe] hat jedoch den Ruf, ein Experte für Konfliktlösung und Krisenmanagement zu sein."
carol_freeman_catch_phrase:	"Kapitän zu sein ist ähnlich wie Vocal Jazz. Es kommt ganz auf die Noten an, die man nicht scattet."
carol_marcus_backstory:	"§YDr. [This.GetName]§! ist ein führender Molekularbiologe und Genetiker. Er gilt als Experte in zahlreichen Bereichen, darunter Bio-Protein-Entwicklung, Zellmutation und Radiobiologie."
carol_marcus_catch_phrase:	"Ich zeige Ihnen etwas, das Sie sich wieder so jung fühlen lässt, als wäre die Welt noch neu."
chakotay_backstory:	" Geboren 2329, §Y[This.GetName]§! ist ein [This.Species.GetName] Kommandooffizier. Aufgewachsen in einer Kultur alter Traditionen. Brach mit dem Volk der [This.GetHerHis], um die Flottenakademie zu besuchen, blieb aber seinen [This.GetHerHis] Wurzeln treu. Beständig, furchtlos und in der Lage, absolute Hingabe zu inspirieren."
chakotay_catch_phrase:	"Aus der Geschichte meines eigenen Planeten weiß ich, dass Veränderungen schwierig sind."
chang_backstory:	" §Y[This.GetName] der Gnadenlose§!, ist ein gefürchteter [This.Species.GetName]  Krieger, der dafür berüchtigt ist, seinen Feinden [This.GetHerHis] grausame Vergeltung zu üben. Er ist den Idealen der [This.Species.GetName]-Vorherrschaft gegenüber äußerst loyal und verachtet das Konzept der friedlichen Koexistenz mit schwächeren Spezies."
chang_catch_phrase:	"taH pagh, taH be?"
charles_tucker_backstory:	"§Y[This.GetName] III§!, den die meisten als §YTrip§! kennen, wurde 2121 in Florida auf §Yder Erde§!. [This.GetSheHeCap] ist ein talentierter Ingenieur mit einer Leidenschaft für exotische Motoren und einer Vorliebe für traditionelle nordamerikanische Küche."
charles_tucker_catch_phrase:	"Wo ist Isaac Newton, wenn man ihn braucht?"
christine_vale_backstory:	"Geboren 2343, §Y[This.GetName]§! ist ein [This.Species.GetName] Kommandant und ehemaliger Detective bei der Zivilpolizei. Bevor er zum Kommando wechselte, diente er als Sicherheitsbeamter. Bekannt dafür, häufig seine Haarfarbe zu ändern."
christine_vale_catch_phrase:	"Du kannst nur dein Bestes geben. Mach dir keine Gedanken über Kleinigkeiten."
christopher_pike_backstory:	"Geboren 2205, §Y[This.GetName]§! gehört zu den höchstdekorierten Offizieren der Flotte. Er erhielt in allen Fächern der Akademie Bestnoten, mit Ausnahme einer 6 in Astrophysik."
christopher_pike_catch_phrase:	"Unsere Mission? Wir erforschen. Wir suchen nach neuem Leben und neuen Zivilisationen. Wir gehen mutig dorthin, wo noch niemand zuvor gewesen ist."
corat_damar_backstory:	"§Y[This.GetName]§! ist ein streng nach Vorschrift handelnder [This.Species.GetName] Soldat, der wenig Sinn für Intrigen oder Feinheiten hat. Hat das Potenzial, das Volk [This.Species.GetName] zu Ruhm zu führen."
corat_damar_catch_phrase:	"Für Cardassia!"
corbin_entek_backstory:	"§Y[This.GetName]§! ist ein kalter und berechnender [This.Species.GetName] Agent. Verfügt über eine besondere Begabung für die Organisation langfristiger Undercover-Operationen, um den Widerstand innerhalb unterdrückter Bevölkerungsgruppen zu untergraben."
corbin_entek_catch_phrase:	"Wenn wir nur Informationen wollten, hätten wir sie schon längst."
crell_moset_backstory:	"Doktor §Y[This.GetName]§! ist ein renommierter [This.Species.GetName] Exobiologe, der sich auf die Erforschung nicht-humanoider Lebewesen spezialisiert hat. Er wirkt äußerlich höflich und zuvorkommend, ist aber in Wirklichkeit kalt, berechnend und skrupellos."
crell_moset_catch_phrase:	"Der Fortschritt in der Medizin hat immer seinen Preis."
cristobal_rios_backstory:	"§Y[This.GetName]§! ist ein talentierter Pilot und mitfühlender Anführer. Im Alter von acht Jahren schlich sich [This.GetSheHe] in einen Flugsimulator der Akademie und erzielte eine Rekordpunktzahl."
cristobal_rios_catch_phrase:	"Ich komme aus Chile, ich arbeite nur im Weltraum."
curzon_antrani_backstory:	"§Y[This.GetName]§! ist ein hervorragender Botschafter und Diplomat. Er ist dafür bekannt, Beziehungen über scheinbar unüberwindbare kulturelle Grenzen hinweg aufzubauen. Er ist ein berüchtigter Romantiker, der den Ruf hat, sich jede Woche in jemand Neues zu verlieben."
curzon_antrani_catch_phrase:	"Es tut mir leid. Ich weiß, dass das schwer für dich ist, aber du wirst darüber hinwegkommen. Vertrau mir, so ist es besser."
dakrah_backstory:	"§Y[This.GetName]§!, Sohn von Ra'Ul, ist ein besonders skrupelloser [This.Species.GetName] Krieger und Befehlshaber. Er ist bereit, für den Sieg Gräueltaten zu begehen, und hält das Leben von Nichtkombattanten für wertlos."
dakrah_catch_phrase:	"Mein Vater hat mich Krieg und Blutvergießen gelehrt."
danig_kell_backstory:	"§Y[This.GetName]§! ist ein taktisch und strategisch fähiger, aber politisch unfähiger [This.Species.GetName] Offizier. Er ist bekannt dafür, rachsüchtig zu sein und alles zu tun, um sich gegen jeden Rivalen durchzusetzen."
danig_kell_catch_phrase:	"Alles, was Sie jetzt tun können, ist, über das Ausmaß Ihrer Schande nachzudenken und zu versuchen, wie ein Cardassianer zu sterben."
dchok_backstory:	 "§Y[This.GetName]§! ist ein [This.Species.GetName] Krieger, der für seine effektive planetarische Regierungsführung bekannt ist. Er verfügt über ein Maß an politischem und diplomatischem Geschick, das unter [This.GetHerHis] Gleichaltrigen nicht üblich ist."
dchok_catch_phrase:	"Ich erkenne die Wahrheit eines Menschen nur, wenn ich ihm in die Augen schaue."
deevad_tysess_backstory:	"§Y[This.GetName]§! ist ein zuverlässiger [This.Species.GetName] Kommandooffizier. Er ist bekannt für seinen individuellen Mut, seine flexiblen Taktiken und dafür, dass er das Leben der Menschen unter seinem Kommando an erste Stelle setzt."
deevad_tysess_catch_phrase:	"Ich schwöre auf das Blut meiner Vorfahren an der Mauer der Helden."
drex_backstory:	"§Y[This.GetName]§!, Sohn von Martok, fehlt [This.GetHerHis] die Ehre seines Vaters. Er ist bekannt für seine Streitlust und sein Talent für Verwaltungsaufgaben. "
drex_catch_phrase:	"Raten Sie noch einmal!"
duras2_backstory:	"§Y[This.GetName]§!, Sohn von Ja'rod, ist ein mächtiger und ehrgeiziger [This.Species.GetName] Krieger. Er ist berüchtigt für [This.GetHerHis] seine unehrenhaften und fast schon verräterischen Taktiken, mit denen er Macht anhäuft und aufrechterhält."
duras2_catch_phrase:	"Du bist ein Narr. Und deine Herausforderung kann nur zum Tod eines Narren führen."
durbin_lemec_backstory:	"Als geschickter Verhandlungsführer und Taktiker genießt §Y[This.GetName]§! es, seine Gegner in unhaltbare Positionen zu manövrieren. Ein Expansionist, der nach der Herrschaft über unterworfene Welten strebt."
durbin_lemec_catch_phrase:	"Die Cardassianische Union hat noch nicht entschieden, wie sie auf diese jüngste Provokation reagieren wird. Aber seien Sie versichert, wir werden reagieren."
dvana_tendi_backstory:	" §Y[This.GetName]§!, §YHerrin der Winterkonstellationen§!, §YSpitze der mondbeschienenen Klinge§! ist eine geschickte [This.Species.GetName] Piratin, Attentäterin ... und Wissenschaftlerin. Sie ist bestrebt, die Stereotypen rund um [This.GetHerHis] Menschen zu widerlegen, trotz [This.GetHerHis] ihrer eigenen Herkunft."
dvana_tendi_catch_phrase:	"Manchmal, wenn ich sage, dass ich auf die Toilette gehe, recodiere ich in Wirklichkeit ihre DNA."
edward_jellico_backstory:	" Geboren 2311, §Y[This.GetName]§! ist ein renommierter [This.Species.GetName] Flaggoffizier und erfahrener Verhandlungsführer. Hat einen einzigartigen, scheinbar tyrannischen Stil, der zu Reibereien mit [This.GetHerHis] Untergebenen führen kann. Begann seine Karriere als Shuttle-Pilot."
edward_jellico_catch_phrase:	"Erledigen Sie es."
elim_garak_backstory:	"Äußerlich freundlich und charmant, ist §Y[This.GetName]§! in Wirklichkeit ein erfahrener Geheimdienstmitarbeiter. Er ist ein Experte für Sabotage und Attentate. Außerdem ist er ein witziger Gesprächspartner, talentierter Gärtner und geschickter Schneider."
elim_garak_catch_phrase:	"Die Wahrheit liegt im Auge des Betrachters. Ich sage nie die Wahrheit, weil ich nicht glaube, dass es so etwas gibt."
enabran_tain_backstory:	"§Y[This.GetName]§! ist ein skrupellos effektiver [This.Species.GetName] Beamter, der niemandem vertraut und extreme Anstrengungen unternimmt, um alle Schwächen, die [This.GetSheHe] haben könnte, zu beseitigen oder zu verbergen haben könnte."
enabran_tain_catch_phrase:	"Ein Mann sollte nicht zulassen, dass seine Feinde ihn überleben."
eris_backstory:	"Erfahren in verdeckten Operationen, §Y[This.GetName]§! ist gerissen und rücksichtslos bei der Verfolgung jeder ihm zugewiesenen Mission [This.GetHerHim]."
eris_catch_phrase:	"Alles an den Jem'Hadar ist tödlich."
ezri_tigan_backstory:	"Geboren 2354, §Y[This.GetName]§! ist [This.Species.GetName] Psychologe und Berater. Ihm fehlt es an Selbstvertrauen, aber er wird von seinen Kollegen respektiert und als zukünftiger Anführer angesehen, wenn [This.GetSheHe] sein Potenzial [This.GetHerHis] entfalten kann."
ezri_tigan_catch_phrase:	"Wir sind keine Götter oder Propheten. Wir sind Menschen. Wir machen Fehler."
felix_knightly_backstory:	"Als talentierter Holo-Autor ist §Y[This.GetName]§! bekannt für seine [This.GetHerHis] historischen Holo-Romane und seine Liebe zur menschlichen Kultur der mittleren Industriezeit."
felix_knightly_catch_phrase:	"Manchmal muss man die Karten spielen, die man bekommt, auch wenn sie einem nicht gefallen."
gabriel_lorca_backstory:	" §Y[This.GetName]§! ist ein besonnener und ausgeglichener Offizier aus der Region, die umgangssprachlich als "Südstaaten der Vereinigten Staaten" auf §Yder Erde§! bekannt ist."
gabriel_lorca_catch_phrase:	"Egal, wie weit man sich im Weltraum befindet, man hat immer das Gefühl, seine Heimat sehen zu können. Meinen Sie nicht auch?"
garkog_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Flottenkommandant. Als großer Krieger und aufbrausender Charakter zieht [This.GetSheHe] es vor, Probleme mit Gewalt zu lösen."
garkog_catch_phrase:	"Deine ewige Qual ist der Traum jedes Klingonen."
geordi_la_forge_backstory:	"Geboren 2335, ist §Y[This.GetName]§! ein Meisteringenieur, dessen intensive Konzentration es ihm ermöglicht hat, mehrere Fachgebiete zu beherrschen. Von Geburt an blind, wird [This.GetHerHis] durch eine kybernetische Prothese mit multispektralem Sehvermögen ausgestattet."
geordi_la_forge_catch_phrase:	"Ich habe immer geglaubt, dass Technologie fast jedes Problem lösen kann. Sie verbessert unsere Lebensqualität, ermöglicht uns Reisen durch die Galaxie – sie hat mir sogar mein Augenlicht zurückgegeben –, aber manchmal muss man einfach alles ausschalten."
gilora_rejal_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Wissenschaftler und Subraumforscher. Er ist Experte für den Einsatz von Subraumrelais. Er hat eine herablassende Meinung von den technischen Fähigkeiten von Männern."
gilora_rejal_catch_phrase:	"Ich könnte Ihnen viele gesunde Kinder schenken, wenn Ihnen das wichtig ist, aber ehrlich gesagt finde ich, dass Sie etwas voreilig sind."
gorkon_backstory:	"§Y[This.GetName]§!, Sohn von Toq, ist ein äußerst erfolgreicher Politiker und diplomatischer Visionär. Er ist ein erfahrener Flottenoffizier und als Krieger weithin respektiert. Heute verfügt er über große politische Macht."
gorkon_catch_phrase:	"Wenn es eine schöne neue Welt geben soll, wird es für unsere Generation am schwierigsten sein, darin zu leben."
gowron_backstory:	"§Y[This.GetName]§!, Sohn von M'Rel, ist eine mächtige Persönlichkeit, wird jedoch von vielen als politischer Außenseiter betrachtet. Er handelt in der Regel ehrenhaft, reagiert jedoch hart auf jede reale oder vermeintliche Bedrohung seiner Position."
gowron_catch_phrase:	"Ich entscheide, was getan werden kann und was nicht."
grilka_backstory:	"§Y[This.GetName]§! ist eine eigensinnige und talentierte [This.Species.GetName] Frau. Sie verfügt über ein ausgeprägtes Verständnis für [This.Species.GetName] Recht und Tradition."
grilka_catch_phrase:	"Tu einfach, was ich sage, dann wird es kein Blutvergießen geben."
hitoroshi_kreel_backstory:	"§YDr. [This.GetName]§! ist ein brillanter [This.Species.GetName] Wissenschaftler, der sich auf Wetterkontrollsysteme und Terraforming-Technologien spezialisiert hat. Er ist auch bekannt für [This.GetHerHis] seine umfangreichen humanitären Bemühungen in Systemen entlang [This.Species.GetName] Handelsrouten."
hoshi_sato_backstory:	"Geboren 2129 in Kyoto, Japan, auf §Yder Erde§!, §Y[This.GetName]§! ist ein begabter Linguist und Kommunikationsoffizier. [This.GetSheHeCap] unterrichtete zuvor Sprachen an der Amazon University und hat einen schwarzen Gürtel in Aikido."
hoshi_sato_catch_phrase:	"Mathematik ist nur eine weitere Sprache."
hugh_culber_backstory:	"§Y[This.GetName]§! ist Arzt und Berater. Er entschloss sich zum Medizinstudium, nachdem er im Alter von 16 Jahren nach einem Wanderunfall notoperiert werden musste."
hugh_culber_catch_phrase:	"Manchmal kann Empathie unangenehm sein."
jadzia_idaris_backstory:	"Geboren 2341, §Y[This.GetName]§! ist ein erfahrener Wissenschaftsoffizier. Ungewöhnlich für einen Wissenschaftler ist, dass [This.GetSheHe] auch ein hochqualifizierter Kämpfer und wird für seine [This.GetHerHis] Kampfkunst respektiert. Besitzt einen unerschütterlichen Sinn für Abenteuer."
jadzia_idaris_catch_phrase:	"Wenn du wissen willst, wer du bist, ist es wichtig zu wissen, wer du gewesen bist."
james_kirk_backstory:	"Geboren 2233, §YJames Tiberius Kirk§! ist eine lebende Legende. Bekannt als der einzige Kadett in der Geschichte der Akademie, der die "No-Win-Szenario"-Simulation gemeistert hat. Ebenso berühmt wie berüchtigt für seine [This.GetHerHis] Neigung, Risiken einzugehen. Für seine Freunde einfach §Y"Jim"§!."
james_kirk_catch_phrase:	"Der Weltraum, die letzte Grenze."
jean_luc_picard_backstory:	"Geboren 2305, §Y[This.GetName]§! ist ein gefeierter Offizier, Archäologe und Diplomat. Verließ den seit Generationen bestehenden Weinberg seiner Familie, um die Akademie zu besuchen. Hatte anfangs Schwierigkeiten, schloss aber als Klassenbester [This.GetHerHis] ab. Als Fähnrich erlitt er lebensverändernde Verletzungen, als er bei einer Schlägerei in einer Bar durch einen Stich ins Herz verletzt wurde."
jean_luc_picard_bad_backstory:	"Geboren 2305, §Y[This.GetName]§! wird von seinen Vorgesetzten als beständig und zuverlässig angesehen. Hat hohe Ziele, scheint aber nicht bereit zu sein, das Notwendige zu tun, um diese zu erreichen. Gilt als risikoscheu und unauffällig."
jean_luc_picard_bad_catch_phrase:	"Ich glaube, dass ich mehr leisten kann."
jean_luc_picard_catch_phrase:	"Mal sehen, was da draußen ist. Angreifen."
jett_reno_backstory:	"§Y[This.GetName]§! ist ein besonnener, pragmatischer [This.Species.GetName] Ingenieur mit Fachkenntnissen in den Bereichen Raumschiffcomputer und Lebenserhaltungssysteme. Bekannt dafür, eine weniger professionelle, wenn auch effektive Arbeitsbeziehung zu [This.GetHerHis] Kollegen zu pflegen."
jett_reno_catch_phrase:	"Hilflosigkeit ist ein beschissenes Gefühl. Aber es ist nicht für immer und macht dich nicht weniger fähig."
jiana_seska_backstory:	" §Y[This.GetName]§! ist ein talentierter [This.Species.GetName] Agent, der besonders geschickt im Infiltrieren ist. Er ist manipulativ und bereit, seine Mitmenschen [This.GetHerHim] zu benutzen, um [This.GetHerHis] Mission zu erfüllen."
jiana_seska_catch_phrase:	"Sagen wir einfach, ich bin in einer einflussreichen Position. Was für Sie ein Glück ist."
john_harriman_backstory:	"Geboren 2259 an Bord eines Schiffes im Weltraum, §Y[This.GetName]§! verbrachte [This.GetHerHis] seine Kindheit auf einer Reihe von Raumschiffen. Vor seinem Eintritt in die Akademie verbrachte er nie mehr als ein paar Wochen auf einem Planeten."
john_harriman_catch_phrase:	"Es wird erst am Dienstag installiert."
jonathan_archer_backstory:	"Geboren 2122 als Sohn des renommierten Warp-Wissenschaftlers Henry Archer und seiner Frau Sally, §Y[This.GetName]§! ist ein versierter Testpilot."
jonathan_archer_catch_phrase:	"Wir werden stolpern, Fehler machen ... sicherlich mehr als nur ein paar, bevor wir unseren Weg finden."
joret_dal_backstory:	"§Y[This.GetName]§! ist ein prinzipientreuer und patriotischer [This.Species.GetName] Offizier. Er hat sein ganzes Leben lang beim Militär gedient [This.GetHerHis], obwohl er Bedenken hatte, dass es kaum mehr als eine Plattform für ehrgeizige Offiziere geworden ist."
joret_dal_catch_phrase:	"Ich habe den Krieg satt. Mein Volk braucht Frieden."
joseph_mbenga_backstory:	"Geboren 2223, §YDoktor [This.GetName]§! ist ein [This.Species.GetName] Arzt, ehemaliger Spezialkräfte-Agent und Überlebender einer großen persönlichen Tragödie. Er verfügt über umfassende Kenntnisse sowohl im militärischen als auch im wissenschaftlichen Bereich."
joseph_mbenga_catch_phrase:	"Ich rette lieber Leben, als sie zu nehmen."
jula_backstory:	"§YMatriarchin [This.GetName]§! ist eine politisch versierte [This.Species.GetName] Adlige, die dafür bekannt ist, ihre Rivalen geschickt auszumanövrieren [This.GetHerHis]. Sie besitzt das Herz einer Kriegerin und duldet keine Anzeichen von Schwäche innerhalb des [This.GetHerHis] Hauses."
jula_catch_phrase:	"Kämpfe für ein Imperium, das Krieger ehrt und falsche Götter vernichtet."
julian_bashir_backstory:	"Geboren 2341, §Y[This.GetName]§! ist ein engagierter Arzt, der sich der Hilfe für Bedürftige verschrieben hat. Aufzeichnungen zeigen, dass [This.GetSheHe] während seiner gesamten Kindheit ein Musterschüler war. Er schloss die Schule als Zweitbester ab, nachdem er in den Abschlussprüfungen nur eine Frage falsch beantwortet hatte."
julian_bashir_catch_phrase:	"Niemand ist entbehrlich."
jurana_backstory:	"Als talentierter Genetiker hat §YJurana§!mit seinen Ansichten zur Förderung vorintelligenter Spezies für Kontroversen gesorgt."
jurana_catch_phrase:	"Es ist unsere Verantwortung, den Funken der Intelligenz zu verbreiten."
kahless_backstory_1:	"Nachdem er das Klingonische Reich gegründet hatte, indem er das klingonische Volk vereinte und ihm die Gesetze der Ehre gab, versprach §Y[This.GetName]§! bei seinem Tod, [This.GetSheHe] würde eines Tages zurückkehren und das Reich erneut führen. \n\nDiese Zeit ist nun gekommen."
kahless_backstory_2:	"Ein Klon des Originals §Y[This.GetName]§!, [This.GetSheHe] hat die Unterstützung derer, die den Wert des Symbols erkennen, das [This.GetSheHe] darstellt."
kahless_catch_phrase:	"Der Wind hat keine Achtung vor einem Narren. Stelle dich nicht vor den Wind."
kamdila_backstory:	"§Y[This.GetName]§! ist ein begabter Wissenschaftler, der den Zorn der [This.Species.GetName] Behörden auf sich zog, weil er sich weigerte, an ihrem kollektiven "Aufstieg" in den Subraum teilzunehmen."
kamdila_backstory_borg:	"Vor der Assimilation §Y[This.GetName]§! war ein Wissenschaftler, der sich mit Transportertechnologie auskannte."
kamdila_catch_phrase:	"Lieber ein Jahrzehnt hier als eine Ewigkeit dort ..."
kamdila_catch_phrase_borg:	"Der Aufstieg ist irrelevant."
kang_backstory:	"§Y[This.GetName]§!, Sohn von K'naiah, gehört zu den gefürchtetsten [This.Species.GetName] Kriegern und renommiertesten Diplomaten der [This.GetHerHis] Ära. Er ist durch Blutsbündnisse mit seinen Mitstreitern Koloth und Kor verbunden."
kang_catch_phrase:	"Nur ein Narr kämpft in einem brennenden Haus."
katherine_pulaski_backstory:	"§Y[This.GetName]§! ist ein versierter Arzt und Forscher, der für seinen [This.GetHerHis] offenen Kommunikationsstil bekannt ist. [This.GetSheHeCap] mag keine Transporter und bevorzugt, wenn möglich, den Einsatz von Shuttles."
katherine_pulaski_catch_phrase:	"Jeder Erfolg hat seinen Preis."
kathryn_janeway_backstory:	"Geboren 2336, §Y[This.GetName]§! ist ein fähiger Kommandant. Bekannt für [This.GetHerHis] seine strikte Einhaltung von Protokollen, [This.GetSheHe] weigert er sich, in Grundsatzfragen Kompromisse einzugehen, selbst wenn der persönliche Preis hoch ist."
kathryn_janeway_catch_phrase:	"Es ist nie einfach, aber wenn wir unseren Prinzipien den Rücken kehren, hören wir auf, Menschen zu sein."
kavok_backstory:	"§Y[This.GetName]§! ist ein gerissener und fähiger [This.Species.GetName] Krieger. Er ist eine Art tickende Zeitbombe und [This.GetSheHe] glaubt, dass die [This.Species.GetName] Menschen in letzter Zeit schwach geworden sind, und betrachtet die bloße Vorstellung von galaktischem Frieden als schwere Schande."
kavok_catch_phrase:	"Erfahrung bij!"
kehleyr_backstory:	"§Y[This.GetName]§! ist ein halb Mensch, halb [This.Species.GetName] Diplomat. Behauptet, die menschliche Seite zu bevorzugen und streng über seine [This.GetHerHis] [This.Species.GetName]  Neigungen zu wachen. Ist geschickt in [This.Species.GetName] Kampftechniken."
kehleyr_catch_phrase:	"Manchmal habe ich das Gefühl, dass in mir ein Monster steckt, das danach strebt, herauszukommen."
keyla_detmer_backstory:	"§Y[This.GetName]§! ist ein erfahrener [This.Species.GetName] Offizier und Navigator. War während des größten Teils seiner [This.GetHerHis] Karriere als Steuermann tätig. Erwarb im Alter von 12 Jahren die [This.GetHerHis] Pilotenlizenz."
keyla_detmer_catch_phrase:	"Nun, wenn die Alternative darin besteht, langsam von der Leere verschlungen zu werden ..."
khan_noonien_singh_backstory:	"Der prominenteste der gentechnisch veränderten §YHuman Augments§! des späten 20. Jahrhunderts, §Y[This.GetName]§! beherrschte einst einen Großteil von §Yder Erde§! Asien und dem Nahen Osten. \n\nNach ihrem Sturz [This.GetSheHe] führte sie eine kleine Gruppe von Anhängern an Bord eines Schlafschiffs, das in den Weltraum aufbrach."
khan_noonien_singh_catch_phrase:	"Verbessere ein mechanisches Gerät und du verdoppelst vielleicht die Produktivität, aber verbessere den Menschen und du gewinnst das Tausendfache. Ich bin ein solcher Mensch."
kilana_backstory:	"Einfühlsam und verführerisch, §Y[This.GetName]§! ist aufrichtig, verständnisvoll und absolut manipulativ. Eigenschaften, die [This.GetHerHim] in Verhandlungen sehr nützlich sind."
kilana_catch_phrase:	"Ich denke, es wäre im Interesse aller, wenn wir uns persönlich treffen würden."
kira_nerys_backstory:	" Geboren 2343, §Y[This.GetName]§! ist ein [This.Species.GetName] Offizier, der sich der Sache der [This.Species.GetName] Freiheit verschrieben hat. Als hartgesottener Kriegsveteran wirkt [This.GetSheHe] oft misstrauisch gegenüber Außenstehenden. Er ist ein frommer Anhänger der [This.Species.GetName] orthodoxen Religion."
kira_nerys_catch_phrase:	"Jeder hat seine Gründe. Das ist das Schreckliche daran: Menschen können jede Handlung rechtfertigen, egal wie böse sie ist. "
kmpec_backstory:	"§Y[This.GetName]§!, Sohn von Korrd, ist ein erfahrener und ehrgeiziger Kommandant. Ein geschickter Kämpfer und Meister im Messerkampf, der mit Sicherheit führt und mit eiserner Faust regiert."
kmpec_catch_phrase:	"Ein Klingone, der tötet, ohne sein Gesicht zu zeigen, hat keine Ehre."
koloth_backstory:	"§Y[This.GetName]§!, Sohn von Lasshar, gehört zu den legendärsten [This.Species.GetName] Kriegern, heldenhaften Militärführern und geschickten Verhandlungsführern der [This.GetHerHis] Ära. Er ist durch Blutsbündnisse der Freundschaft mit seinen Mitstreitern Kor und Kang verbunden."
koloth_catch_phrase:	"Ein scharfes Messer ist nichts ohne ein scharfes Auge."
kor_backstory:	"§Y[This.GetName]§!, Sohn von Rynar, gehört zu den einflussreichsten [This.Species.GetName] Kriegern und angesehenen Militärführern der [This.GetHerHis] Ära. Er ist durch einen Blutschwur der Freundschaft mit seinen Mitstreitern Koloth und Kang verbunden."
kor_catch_phrase:	"Genießt die Früchte des Lebens, meine jungen Freunde. Sie schmecken süß, wenn sie frisch vom Baum gepflückt sind. Aber lebt nicht zu lange. Der Geschmack wird bitter ... nach einer Weile."
korath_backstory:	"§Y[This.GetName]§! ist brillant, aber unzuverlässig und wird von vielen als "verrückter Wissenschaftler" angesehen. Einst ein großer Krieger, widmet sich [This.GetHerHis] nun der Entwicklung fortschrittlicher Technologien für militärische Zwecke."
korath_catch_phrase:	"Du stellst meine Ehre in Frage?"
korin_backstory:	"§Y[This.GetName]§! wird von einigen als einer der höchstdekorierten, kampferprobten [This.Species.GetName] Krieger der Geschichte angesehen. Er hat zahlreiche erfolgreiche "Grey Ops"-Missionen durchgeführt. Trinkt übermäßig viel."
korin_catch_phrase:	"Ah, ich muss dich über meine vielen sexuellen Eroberungen auf dem Laufenden halten!"
korrd_backstory:	" §Y[This.GetName]§! ist ein hoch angesehener Militärstratege und Diplomat. Bekannt in ganz [Owner.GetName] und darüber hinaus, werden [This.GetHerHis] Strategien an Militärakademien im gesamten Quadranten studiert."
korrd_catch_phrase:	"Ich bin ein törichter alter Mann."
kotan_padar_backstory:	"Ehemals Wissenschaftler, wechselte §Y[This.GetName]§! auf Drängen seiner Familie [This.GetHerHis] in die Politik. Befürwortet friedliche interstellare Beziehungen und lehnt aggressive Expansionisten ab."
kotan_padar_catch_phrase:	"Die Familie ist alles."
kruge_backstory:	"§Y[This.GetName]§!, Sohn von Vastal, ist ein skrupelloser und kaltblütiger [This.Species.GetName] Kriegsherr. Er wird von seinen Anhängern ebenso gefürchtet und respektiert wie von seinen Feinden."
kruge_catch_phrase:	"Ich hoffe, du genießt den Schmerz."
kruvang_backstory:	"§YDr. [This.GetName]§! ist ein standhafter [This.Species.GetName] Krieger und Genetiker. Er zeigt die typische [This.Species.GetName] Entschlossenheit, seine Feinde im Kampf zu besiegen oder, falls dies nicht gelingt, mit Ehre zu sterben."
kruvang_catch_phrase:	"Ich werde nicht sterben, bevor meine Mission erfüllt ist!"
kurn_backstory:	"Geboren 2345, §Y[This.GetName]§!, Sohn von Mogh, ist ein geschickter [This.Species.GetName] Krieger und Feldherr. Er ist eigensinnig, aber durch ein unerschütterliches Ehrgefühl und Pflichtbewusstsein gemildert."
kurn_catch_phrase:	"Die Ehre eines Klingonen bedeutet ihm mehr als sein Leben."
laga_makbar_backstory:	"§Y[This.GetName]§! ist ein hochrangiger Archon im [This.Species.GetName] Justizsystem und verfügt über enge Verbindungen zu [Owner.GetSpyAgencyDefinitive]."
laga_makbar_catch_phrase:	"Wir glauben an schnelle Gerechtigkeit."
landru_catch_backstory:	"Vor Tausenden von Jahren von einem gleichnamigen betanischen Ingenieur geschaffen, interagiert §Y[This.GetName]§! über eine holografische Projektion."
landru_catch_phrase:	"Landru strebt nach Ruhe. Frieden für alle. Das universelle Wohl."
lem_broca_backstory:	"§Y[This.GetName]§! ist ein prominenter [This.Species.GetName] Militärkommandant. Er ist ehrgeizig und bereit, Befehle ohne zu hinterfragen zu befolgen, um [This.GetHerHis] Position voranzubringen."
lem_broca_catch_phrase:	"Ich habe alles getan, was Sie verlangt haben! Ich versichere Ihnen, dass ich loyal bin."
leonard_mccoy_backstory:	"Geboren 2227, §YDr. [This.GetName]§! ist ein versierter Chirurg, Arzt und Exobiologe. Er gilt als einer der führenden Experten für Weltraumpsychologie. Seine Freunde nennen ihn §Y"Bones"§!."
leonard_mccoy_catch_phrase:	"Ich bin Arzt, kein Ingenieur."
lewis_zimmerman_backstory:	"Geboren 2320, §YDr. [This.GetName]§! ist ein renommierter Wissenschaftler und Holo-Ingenieur. Obwohl er als äußerst schwieriger Arbeitskollege bekannt ist, [This.GetSheHe] gilt er dennoch als Vater der modernen Holografie."
lewis_zimmerman_catch_phrase:	"Warum machen sich alle solche Sorgen, dass Hologramme die Welt übernehmen könnten?"
liam_shaw_backstory:	"§Y[This.GetName]§! wirkt nach außen hin ruppig, legt aber größten Wert auf die Sicherheit derjenigen, die unter [This.GetHerHis] seinem Kommando stehen. Begann seine Karriere als "Schmiermonkey" und verfügt nach wie vor über fundierte technische Kenntnisse."
liam_shaw_catch_phrase:	"Ist es wichtig für Sie zu wissen, dass ich einen schönen Morgen hatte, bevor all das passierte?"
lrell_backstory:	"§Y[This.GetName]§! ist ein Kind zweier verfeindeter Adelshäuser. Ist fest davon überzeugt, dass [This.Species.GetNamePlural] nicht durch erbitterte Rivalitäten und Blutfehden gespalten sein sollte, sondern als ein geeintes Volk zusammenarbeiten sollte. "
lrell_catch_phrase:	"Das mächtigste Imperium ist ein vereintes Imperium."
lursa_backstory:	"§Y[This.GetName]§!, Tochter von Ja'rod, Schwester von B'Etor, ist eine gerissene und gefürchtete [This.Species.GetName] Kriegerin. Sie ist bereit, alles zu tun, um die Macht des [This.GetHerHis] Hauses zu vergrößern."
lursa_catch_phrase:	"Ugh! Menschliche Frauen sind so abstoßend."
malyn_ocett_backstory:	"§Y[This.GetName]§! ist eine brillante und erfahrene [This.Species.GetName] Offizierin. Als ungewöhnlich mächtige Frau innerhalb des [This.Species.GetName] Militärs wird [This.GetSheHe] von ihren männlichen Rivalen als verräterisch bezeichnet."
malyn_ocett_catch_phrase:	 "Vielleicht können wir uns ein anderes Mal gegenseitig beleidigen. Ich bin gerade ziemlich beschäftigt."
martok_backstory:	" Als Sohn von Urthog wurde §Y[This.GetName]§! als Bürgerlicher geboren und zunächst als Krieger abgelehnt und zu niederen Aufgaben verdammt. Durch ruhmreiche Taten verdiente er sich eine Beförderung auf dem Schlachtfeld und brachte dem Haus [This.GetHerHis] große Ehre ein."
martok_catch_phrase:	"Es gibt keinen größeren Feind als die eigenen Ängste."
maxwell_forrest_backstory:	"Als Verantwortlicher für das NX-Projekt in den 2140er Jahren hat §Y[This.GetName]§! seine Fähigkeiten im Management von Flottenoperationen unter Beweis gestellt."
maxwell_forrest_catch_phrase:	"Seit fast einem Jahrhundert waten wir knöcheltief im Ozean des Weltraums."
MESSAGE_TYPE_WAR_INVITE_DECLINED_MESSAGE:	"Die $COUNTRY$ hat unsere Bitte um Unterstützung in unserem Krieg gegen das Kollektiv abgelehnt."
MESSAGE_TYPE_WAR_INVITE_DECLINED_TITLE:	"Kriegsantrag abgelehnt"
michael_burnham_backstory:	"Geboren 2226, §Y[This.GetName]§! ist ein [This.Species.GetName] Offizier mit Fachkenntnissen in Xenoanthropologie, Quantenphysik und zahlreichen anderen Bereichen. Nach dem gewaltsamen Tod seiner leiblichen Eltern [This.GetHerHis] wuchs er bei Pflegeeltern auf."
michael_burnham_catch_phrase:	"Wenn man vor allem Angst hat, lernt man nichts."
michael_eddington_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Sicherheitsspezialist. Ursprünglich strebte er eine Karriere als Raumschiffkapitän an, entdeckte jedoch später sein einzigartiges Talent für taktische Operationen. Er liebt besonders den alten Roman Les Misérables."
michael_eddington_catch_phrase:	"Für mich zählt nur, meine Arbeit zu machen. Alles andere ist Luxus."
miles_obrien_backstory:	"Geboren 2328, §Y[This.GetName]§! trat mit siebzehn Jahren als Mannschaften in den Dienst. Experte für Transportsysteme und Stationsbetrieb. Anerkannte Autorität im Bereich Raumschiffkampf."
miles_obrien_catch_phrase:	"Ich bin kein Engel, aber ich versuche, jeden Tag so gut wie möglich zu leben."
mogh_backstory:	"§Y[This.GetName]§! ist ein einflussreicher [This.Species.GetName] mit vielen Verbündeten und Feinden. Unerfahren im Umgang mit dem Bat'leth, aber ein ausgezeichneter Schütze. Ein erfahrener Krieger und Geheimdienstmitarbeiter."
mogh_catch_phrase:	"Ich bin Mogh, Sohn von Worf."
montgomery_scott_backstory:	"Geboren 2222, §YScotty§!, wie ihn seine [This.GetHerHis] Schiffskameraden nennen, ist ein Mann mit überragenden technischen Fähigkeiten, Erfahrung und Einfallsreichtum. Bekannt als "Wundertäter" der Technik."
montgomery_scott_catch_phrase:	"Ich habe mein ganzes Leben damit verbracht, verrückte Wege zu finden, Dinge zu tun."
natima_lang_backstory:	"Als aufsteigender Stern in der [This.Species.GetName] Politik wird §Y[This.GetName]§! von der Bevölkerung hoch geschätzt. Ehemaliger Professor für politische Ethik am Institut für Staatspolitik."
natima_lang_catch_phrase:	"Es gibt einige, die glauben, dass die Zukunft von Cardassia nicht in den Händen des Militärs bleiben sollte."
nog_backstory:	"Geboren 2353, §Y[This.GetName]§! ist bekannt für seine Hartnäckigkeit und Entschlossenheit. Er verfügt über den typischen Geschäftssinn eines [This.Species.GetName], besitzt aber auch Führungsqualitäten, die unter [This.GetHerHis] nicht als üblich gelten."
nog_catch_phrase:	"Du weißt nichts über Opfer, Ehre, Pflicht oder all die Dinge, die das Leben eines Soldaten ausmachen. Ich bin Teil von etwas, das größer ist als ich selbst."
noonien_soong_backstory:	"Geboren 2279, §YDr. [This.GetName]§! gilt als einer der größten [This.Species.GetName] Kybernetiker und Computertechnologen, die je gelebt haben. Er ist zutiefst besessen von der Vision, eine wirklich unabhängig denkende Maschine zu schaffen."
noonien_soong_catch_phrase:	"Warum malt ein Maler? Warum boxt ein Boxer? Wissen Sie, was Michelangelo immer gesagt hat? Dass die Skulpturen, die er schuf, schon da waren, bevor er anfing, versteckt im Marmor."
norah_satie_backstory:	"Als Tochter eines renommierten Richters §Y[This.GetName]§! sehen viele [This.GetHerHim] als standhaft und entschlossen an, während andere [This.GetHerHim] lediglich als stur betrachten."
norah_satie_catch_phrase:	"Tu, was du tun musst ... und ich werde es auch tun."
noum_backstory:	"§YDr. [This.GetName]§! ist ein schroffer [This.Species.GetName] Arzt und Berater. Obwohl er Neuankömmlingen gegenüber zunächst zurückhaltend ist und wenig Zeit für unerprobte Nachwuchsoffiziere hat, §YDr. [This.GetName]§! ist denen, die es verdient haben, äußerst loyal."
noum_catch_phrase:	"Als Ihr Arzt befehle ich Ihnen, diesen Kaffee zu trinken. Reißen Sie sich zusammen."
nyota_uhura_backstory:	"§Y[This.GetName]§! hatte ursprünglich vor, an der Universität zu studieren, an der [This.GetHerHis] seine Eltern lehrten, entschied sich jedoch nach ihrem tragischen Tod dafür, stattdessen die Akademie zu besuchen. Spricht 37 Sprachen fließend."
nyota_uhura_catch_phrase:	"Manchmal denke ich, wenn ich das Wort "Frequenz" noch einmal höre, muss ich weinen."
oratt_backstory:	"§YDr. [This.GetName]§! ist ein leitender [This.Species.GetName] Arzt und Verwaltungsbeamter. Er glaubt fest an die Aufrechterhaltung [This.Species.GetName] kultureller Normen und lehnt es ab, Informationen über bestimmte [This.Species.GetName] Erkrankungen an Außenstehende weiterzugeben."
oratt_catch_phrase:	"Es tut mir leid, dass Sie die Komplexität unserer Kultur nicht verstehen."
paul_stamets_backstory:	"§Y[This.GetName]§! ist Astromykologe. Er widmete sich jahrelang der Entwicklung einer hypothetischen Antriebsmethode, die mit dem sogenannten Myzelnetzwerk in Verbindung steht, erzielte jedoch keine entscheidenden Ergebnisse."
paul_stamets_catch_phrase:	"Auf Quantenebene gibt es keinen Unterschied zwischen Biologie und Physik. Überhaupt keinen Unterschied."
philippa_georgiou_backstory:	"Geboren 2202, §Y[This.GetName]§! ist ein hochdekorierter Kommandant. [This.GetSheHeCap] hat in der Vergangenheit große Verluste erlitten, blickt aber weiterhin optimistisch in die Zukunft."
philippa_georgiou_catch_phrase:	"Wir schießen nicht aus einer Laune heraus. Und wir nehmen keine unschuldigen Leben, Punkt."
portal_63_backstory:	" Mit über sechshunderttausend Jahren wurde §Y[This.GetName]§! als Wächter für den Zugang zum §YTkon-Reich§! geschaffen. Da die Tkon nun ausgestorben sind, hat [This.GetSheHe] [This.GetHerHis] seine Dienste angeboten, im Austausch für Hilfe bei der Erforschung des Schicksals der [This.GetHerHis] Zivilisation."
portal_63_catch_phrase:	"Ich möchte einen Gedanken äußern. Derjenige wird triumphieren, der weiß, wann er kämpfen muss und wann nicht."
prexian_one_backstory:	"Einst ein nicht-körperliches Wesen, hat §Y[This.GetName]§! eine physische Form angenommen, um die materielle Welt zu erleben."
prexian_one_phrase:	"Es ist Zeit, etwas Neues zu erleben."
promellian_survivor_backstory:	" §Y[This.GetName]§! ist einer der wenigen [This.Species.GetName] Überlebenden, da die meisten [This.GetHerHis] ihrer Spezies vor Jahrhunderten während ihres Krieges mit den Menthar getötet wurden. "
promellian_survivor_catch_phrase:	"Lerne aus dem Schicksal meines Volkes ..."
quark_backstory:	"§Y[This.GetName]§! hat durch unzählige zwielichtige Abenteuer und oft schlecht durchdachte Geschäftsvorhaben Berühmtheit erlangt. Aufgrund seiner relativ mitfühlenden Art wird er von seinen [This.Species.GetName] Kritikern als weich angesehen. "
quark_catch_phrase:	"Was für den einen unbezahlbar ist, ist für den anderen wertlos."
rachel_garrett_backstory:	"Geboren 2294, §Y[This.GetName]§! ist ein sehr erfahrener Raumschiffkommandant und als ehemaliger Taktikoffizier ein geschickter Kämpfer."
rachel_garrett_catch_phrase:	" Wir werden dafür sorgen, dass es in die Geschichtsbücher eingeht."
raffaela_musiker_backstory:	"Geboren 2353, §YRaffi§! ist eine schwierige, aber brillante Persönlichkeit. Er ist ein begabter Analytiker und hervorragender Taktiker, leidet jedoch unter Drogenmissbrauch und anderen psychischen Problemen."
raffaela_musiker_catch_phrase:	"Ich bin eher wie die Trümmer eines guten Menschen. In einer Notsituation kann man aus den Bruchstücken einen vorübergehend guten Menschen zusammenbasteln."
rain_robinson_backstory:	" Nachdem er nach seiner Niederlage im Großen Eugenik-Krieg Jahre in kryogener Stasis verbracht hatte, war §Y[This.GetName]§! einer der wenigen Nicht-Augmentierten, die die Pläne der genetisch überlegenen [This.GetHerHis] durchkreuzen konnten. "
rain_robinson_catch_phrase:	"Man kann ein Mädchen nicht davon abhalten, Hypothesen aufzustellen."
reginald_barclay_backstory:	"§YReginald Endicott Barclay III§!, oder §Y"Reg"§!, ist ein schüchterner Mensch, der häufig nervöses Verhalten und mangelndes Selbstvertrauen zeigt. Trotzdem ist [This.GetSheHe] äußerst intelligent und kompetent."
reginald_barclay_catch_phrase:	"Ich bin der Typ, der sich Dinge aufschreibt, die er auf einer Party sagen will. Und wenn er dann endlich dort ist, sitzt er allein in einer Ecke und versucht, entspannt zu wirken, während er eine Topfpflanze betrachtet."
rekom_madred_backstory:	"§Y[This.GetName]§! verkörpert viele der Werte, die unter den Offizieren von  [This.Species.GetName] hoch geschätzt werden. Kompromisslos und gnadenlos, bereit, alle Mittel einzusetzen, um die Interessen der [This.GetHerHis] Nation voranzubringen."
rekom_madred_catch_phrase:	"Wie viele Lichter sehen Sie dort?"
ro_laren_backstory:	"Geboren 2340, §Y[This.GetName]§! ist ein [This.Species.GetName] Kommandant und Geheimdienstmitarbeiter. Er überlebte eine äußerst schwierige Kindheit als Flüchtling, die [This.GetHerHis] Weltanschauung prägte. Er gerät oft in Konflikt mit Autoritäten."
ro_laren_catch_phrase:	"Ich möchte mich nicht länger für mein Erbe schämen."
rom_backstory:	"Geboren 2333, §Y[This.GetName]§! gilt als völliger Versager, wenn es um Geschäfte geht. Dies stört §Y[This.GetName]§! jedoch nicht, da er seinen eigenen Weg als mechanisches und technisches Genie gefunden hat."
rom_catch_phrase:	" Stimmt etwas nicht, Chef? Ich kann langsamer arbeiten, wenn Sie möchten."
saavik_backstory:	"Geboren 2264, erlebte §Y[This.GetName]§! eine harte Kindheit auf einer gescheiterten Kolonialwelt. Von [This.Species.GetName] Eltern adoptiert und von der Welt weggebracht, [This.GetSheHe] erzielte trotz gelegentlicher Schwierigkeiten, fremde Kulturen zu verstehen, herausragende Erfolge an der Akademie."
saavik_catch_phrase:	"Humor. Das ist ein schwieriges Konzept. Es ist nicht logisch."
samanthan_rutherford_backstory:	 "Ein energischer und sachkundiger Ingenieur. §Y[This.GetName]§! erlitt im ersten Jahr als Kadett schwere Verletzungen, die umfangreiche kraniale Kybernetik erforderten. Hasst Birnen."
samanthan_rutherford_catch_phrase:	"Nun, wenn Sie eine nicht ausgerichtete EPS-Leitung sehen, rufen Sie mich nicht an. Meine sind verdammt gut ausgerichtet."
sarek_backstory:	"Geboren 2165, §Y[This.GetName]§! ist ein erfahrener [This.Species.GetName] Diplomat und Beamter. Er erhielt eine traditionelle [This.Species.GetName] Erziehung und wurde von klein auf auf eine Karriere im diplomatischen Dienst vorbereitet."
sarek_catch_phrase:	"Ich wurde in meinem Leben schon vieler Dinge beschuldigt, aber niemals übermäßiger Emotionalität."
saru_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Beamter mit agrarischem Hintergrund. Als Kind dachte [This.GetSheHe] über den Platz der Menschen im Universum nach, was ihn schließlich dazu veranlasste, [This.GetHerHis] unter den Sternen nach Antworten zu suchen."
saru_catch_phrase:	"Wir haben eine Pflicht zu erfüllen und werden uns nicht mit einer ausweglosen Situation abfinden."
savar_backstory:	"Geboren 2226, §Y[This.GetName]§! ist ein wachsamer [This.Species.GetName] Kommandooffizier, der sich auf die Koordination groß angelegter Sicherheitsoperationen spezialisiert hat. Von seinen Anhängern wird er als majestätisch beschrieben, von anderen als dramatisch."
savar_catch_phrase:	"Geduld ist eine unserer Tugenden."
selar_backstory:	"Geboren 2324, §YDr. [This.GetName]§! ist ein [This.Species.GetName] Arzt. Als Jugendlicher stellte er fest, dass [This.GetSheHe] keine ausgeprägten telepathischen Fähigkeiten hatte, und schlug daher eine wissenschaftliche Laufbahn in der Medizin ein, anstatt eine Ausbildung zum traditionellen [This.Species.GetName] Heiler zu absolvieren."
selar_catch_phrase:	"Welche Symptome haben Sie bemerkt?"
sirella_backstory:	" §Y[This.GetName]§!, Tochter von Linkasa, ist eine stolze und eigensinnige [This.Species.GetName] von adeliger Abstammung, deren mütterliche Linie bis zu Shenara, der Tochter von Kaiser Reclaw aus der Zweiten Dynastie, zurückreicht."
sirella_catch_phrase:	"Die Herzen der Klingonen zerstörten die Götter, die sie erschaffen hatten, und verwandelten den Himmel in Asche."
skagg_boheeka_backstory:	 "§Y[This.GetName]§! ist ein kluger und ehrgeiziger [This.Species.GetName] Offizier. Er ist dafür bekannt, dass er inoffizielle Gelegenheiten nutzt, um [This.GetHerHis] aufzusteigen, selbst wenn das persönliche Risiko groß ist."
skagg_boheeka_catch_phrase:	"Sie haben meine ungeteilte Aufmerksamkeit."
skrain_dukat_backstory:	"§Y[This.GetName]§! ist ein prominenter [This.Species.GetName] Beamter, der von vielen als narzisstisch und egoistisch angesehen wird. Ein äußerst gefährlicher Mensch, der vor nichts zurückschreckt, um [This.GetHerHis] seine Position unter dem Deckmantel des Schutzes der [This.Species.GetName] Bevölkerung zu verbessern."
skrain_dukat_catch_phrase:	"Ein wahrer Sieg besteht darin, deinen Feind erkennen zu lassen, dass es falsch war, sich dir überhaupt zu widersetzen."
solok_backstory:	" §Y[This.GetName]§! ist ein hochdekorierter [This.Species.GetName] Kommandant und Träger mehrerer Tapferkeitsmedaillen. Manchmal führt [This.GetHerHis] seine milde Haltung der [This.Species.GetName] Überlegenheit zu Reibereien mit Offizieren anderer Spezies, aber die meisten würden zugeben, dass [This.GetSheHe] sehr fähig ist."
solok_catch_phrase:	"Sie versuchen, einen Triumph zu inszenieren, wo es keinen gibt."
sonak_backstory:	"§Y[This.GetName]§! ist ein hoch angesehener [This.Species.GetName] Ingenieur und Wissenschaftsoffizier. Er wurde von einflussreichen Persönlichkeiten innerhalb der Admiralität für eine hochrangige Position empfohlen."
sonak_catch_phrase:	"Ihnen unterstellt, Sir?"
sonya_gomez_backstory:	"Geboren 2340, §Y[This.GetName]§! blüht in Krisensituationen auf und verfügt über ausgeprägte Entscheidungsfähigkeiten. War zuvor als Ingenieur mit Spezialisierung auf Antimaterie tätig."
sonya_gomez_catch_phrase:	"Was auch immer da draußen ist, wir werden die Ersten sein, [This.Species.GetNamePlural] die es sehen. Und ich möchte dabei sein."
sopek_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Offizier und Raumschiffkommandant. Selbstbewusst bis zur Arroganz. Hat eine sehr schlechte Meinung von den Führungs- und taktischen Fähigkeiten anderer Spezies."
sopek_catch_phrase:	"Es wäre am besten, wenn Sie von törichten Unternehmungen Abstand nehmen würden."
soulless_minions_of_orthodoxy_leader_backstory:	" Von vielen als etwas exzentrisch angesehen, betrachtet §Y[This.GetName]§! [This.GetHerselfHimself] als einen Experten auf dem Gebiet der §BZellularen Unterhaltung§!. "
soulless_minions_of_orthodoxy_leader_catch_phrase:	"Ich möchte Ihnen beiden eine einfache Frage stellen. Wollen Sie sterben?"
soval_backstory:	"Bekannt für seine logische und vorsichtige Art, verbirgt sich hinter der strengen Fassade von §Y[This.GetName]§! ein tiefes Pflichtbewusstsein und ein Engagement für den Frieden."
soval_phrase:	"Wir müssen lernen, einander zu vertrauen, wenn wir überleben wollen."
spock_backstory:	"§Y[This.GetName]§! wurde 2230 als Sohn eines vulkanischen Vaters und einer menschlichen Mutter geboren. Er weist die meisten vulkanischen physiologischen Merkmale auf und kann mit großer Anstrengung die turbulenten Emotionen seiner menschlichen Seite weitgehend kontrollieren. Er verfügt über einen unvergleichlichen Intellekt und ein lebenslanges Interesse an Kunst, Literatur, Poesie, Musik und insbesondere an dreidimensionalem Schach."
spock_catch_phrase:	"Lebe lang und in Wohlstand."
sylvia_tilly_backstory:	"Geboren 2233, §Y[This.GetName]§! ist ein ehrgeiziger und begabter Mensch. Er durchlief die Akademie im Eiltempo und kehrte anschließend als Ausbilder zurück."
sylvia_tilly_catch_phrase:	"Vielleicht liebst du die Wissenschaft, weil du mit Geistern und Energien lebst, die größer sind als wir."
tekeny_ghemor_backstory:	"§Y[This.GetName]§! ist ein effektiver und ungewöhnlich ehrenhafter [This.Species.GetName] Offizier. Er ist ein Gegner expansionistischer Ideale, wird aber, wenn es erforderlich ist, bis zum Ende kämpfen, um das Volk [This.Species.GetName] zu schützen."
tekeny_ghemor_catch_phrase:	"Geduld ist etwas für junge Leute."
terral_backstory:	" §Y[This.GetName]§! ist ein [This.Species.GetName] Flottenoffizier und Stratege. Als überzeugter Verfechter der Logik ist [This.GetSheHe] manchmal beunruhigt über die unlogischen und emotionalen Tendenzen anderer Spezies."
terral_catch_phrase:	"Sie werden feststellen, dass Ihre Leistungen nicht unbemerkt geblieben sind."
the_clown_backstory:	"Eine holografische Manifestation, die entstand, als fünf Individuen ihr Bewusstsein in einem neuronalen Netzwerk verbanden, während sie nach einer Umweltkatastrophe auf Rettung warteten. \n\nUnvorhergesehene Rückkopplungen schufen eine bösartige Manifestation ihrer schlimmsten Ängste, die ihre Gedanken quälte, während ihre Körper in Stasis gefangen waren."
the_clown_catch_phrase:	"Wenn Ihre einzige Realität eine Illusion ist, dann ist die Illusion Realität."
thomas_paris_backstory:	"§Y[This.GetName]§!, oder §Y"Tom"§! wird dafür respektiert, dass er drei Kollegen auf Caldik Prime das Leben gerettet hat, wodurch er sich [This.GetHerHis] den Ruf als einer der besten Piloten der Flotte erworben hat."
thomas_paris_catch_phrase:	"Ich bin Pilot, kein Arzt."
thrax_sakat_backstory:	 "§Y[This.GetName]§! ist ein äußerst fähiger [This.Species.GetName] Sicherheitsbeamter. Er gilt als arrogant, ist aber den [This.Species.GetName] Menschen gegenüber unerschütterlich loyal, obwohl er oft mit der Politik der Regierung nicht einverstanden ist."
thrax_sakat_catch_phrase:	"Ihr Fall wird heute Nachmittag vor einem Sondergericht verhandelt. Sie werden unmittelbar vor der Verhandlung über das Urteil informiert."
tkuvma_backstory:	"§Y[This.GetName]§! ist ein überzeugter Traditionalist und [This.Species.GetName] Ultranationalist. Von seinen Anhängern wird er als Messias angesehen, der sie vereinen und die Spezies zur Vorherrschaft über eine schwache und unterwürfige Galaxie führen wird."
tkuvma_catch_phrase:	"Ein Krieger, der ehrenhaft im Kampf stirbt, ist gesegnet."
tlara_backstory:	"§Y[This.GetName]§! ist ein erfahrener [This.Species.GetName] Kommandant und Militärrichter. Ehemaliger Navigationsoffizier."
tlara_catch_phrase:	"Ich werde Ihnen erlauben, diese Frage zu untersuchen, aber nur so weit, wie es die Logik zulässt."
tles_backstory:	"§Y[This.GetName]§! ist ein bekannter [This.Species.GetName] Wissenschaftler und Dozent an der [This.Species.GetName] Wissenschaftsakademie. Er hat ein größeres Verständnis und eine tiefere Einsicht in Emotionen als die meisten [This.GetHerHis] Menschen."
tles_catch_phrase:	"Wir drücken unsere Emotionen vielleicht nicht aus, aber wir sind sensibel dafür."
tlyn_backstory:	"Geboren 2319, §Y[This.GetName]§! ist ungewöhnlich für einen [This.Species.GetName], da [This.GetSheHe] andere Faktoren als die Logik in seine [This.GetHerHis] Überlegungen einfließen lässt, sehr zum Missfallen seiner [This.GetHerHis] [This.Species.GetName] Landsleute, die [This.GetHerHis] für rücksichtslos unlogisch halten."
tlyn_catch_phrase:	"Statistisch gesehen ist die Wahrscheinlichkeit, dass Fähnriche, die unter kürzlich beförderten Kommandanten dienen, sterben und/oder verstümmelt werden, höher."
tpragh_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Politiker und ehemaliger Flottenoffizier. Er ist ein Experte im Umgang mit Krisensituationen und wird von vielen als geeigneter Kandidat für ein hohes politisches Amt angesehen."
tpring_backstory:	"Geboren 2230, §Y[This.GetName]§! ist ein [This.Species.GetName] Verwaltungsbeamter und Berater. Er widmet sich der Rehabilitation von Menschen, deren unkontrollierte Emotionen sie zu Kriminellen gemacht und gegen die Logik aufgebracht haben."
tpring_catch_phrase:	"Die gegenseitige Akzeptanz von Opfern ist entscheidend für eine erfolgreiche Beziehung."
trekal_darheel_backstory:	"§Y[This.GetName]§! ist ein brutal effektiver [This.Species.GetName] Militäraufseher. Er ist berüchtigt dafür, Arbeitslager zu betreiben, in denen er wenig bis gar keine Rücksicht auf das Leben der Insassen nimmt."
trekal_darheel_catch_phrase:	"Was Sie Völkermord nennen, nenne ich Tagesarbeit."
trica_korinas_backstory:	"§Y[This.GetName]§! ist ein kluger und selbstbewusster [This.Species.GetName] Geheimdienstagent. Er hat viele erfolgreiche Missionen geleitet und überwacht häufig gemeinsame Operationen mit dem Militär."
trica_korinas_catch_phrase:	"Diese Angelegenheit ist geheim."
tuvok_backstory:	"Geboren 2264, §Y[This.GetName]§! ist ein [This.Species.GetName] taktischer Offizier, Wissenschaftler,  Akademielehrer und preisgekrönter Orchideenzüchter. Als Teenager rebellierte er gegen die Ideale der Logik und Vernunft von [This.Species.GetName], widmete sich jedoch anschließend intensiv der Meditation, dem Studium und Ritualen, um die Emotionen von [This.GetHerHis] vollständig zu beherrschen."
tuvok_catch_phrase:	"Das vulkanische Herz wurde aus Barbarei und Gewalt geschmiedet. Wir haben gelernt, es zu kontrollieren, aber es ist immer noch ein Teil von uns. So zu tun, als existiere es nicht, bedeutet, ihm eine Gelegenheit zu geben, zu entkommen."
ulani_belor_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Wissenschaftler und Subraumforscher. Ein Experte für den Einsatz von Subraumrelais."
ulani_belor_catch_phrase:	"Es ist so selten, einen Nicht-Cardassianer zu treffen, der unsere Literatur schätzt."
vakel_shon_backstory:	"Geboren 2363, §Y[This.GetName]§! ist ein [This.Species.GetName] Kommandant mit vielfältiger Erfahrung als Taktikoffizier, Entdecker und Diplomat, dem zahlreiche Erstkontakte zu verdanken sind. Obwohl er ein leidenschaftlicher Mensch ist, hat [This.GetSheHe] gelernt, seine Emotionen beiseite zu lassen, wenn es die Situation erfordert. Außerdem ist er ein geschickter Ushaan-Tor-Duellant."
vakel_shon_catch_phrase:	"Wir haben bereits zu viel verloren. Wir dürfen nicht noch mehr verlieren. Letztendlich müssen wir alle unsere Differenzen beiseite legen und uns vereinen."
valeris_backstory:	"Als talentierter Offizier angesehen, wurde §Y[This.GetName]§! von einer Reihe hochrangiger Führungskräfte unterstützt und gefördert, wird aber von einigen als arrogant angesehen."
valeris_catch_phrase:	"Ich möchte Sie daran erinnern, dass die Vorschriften nur den Einsatz von Triebwerken im Raumdock vorsehen."
vanik_backstory:	"§Y[This.GetName]§! ist ein [This.Species.GetName] Raumschiffkommandant mit Fachkenntnissen sowohl in taktischen Operationen als auch in Erstkontaktmissionen. Von Angehörigen anderer Spezies wird er als stoisch und distanziert wahrgenommen."
vanik_catch_phrase:	"Ihre Unerfahrenheit und Ihre Arroganz sind Ihre Feinde."
vaug_danar_backstory:	"§Y[This.GetName]§! ist ein fremdenfeindlicher [This.Species.GetName] Offizier. Von manchen als wenig subtil angesehen, aber dennoch ein effektiver und gefährlicher Kommandant."
vaug_danar_catch_phrase:	"Ich akzeptiere Ihre Entschuldigung, aber nicht Ihre Erklärung."
voq_backstory:	"§Y[This.GetName]§! ist ein seltener Albino und wurde daher aus dem Hause [This.GetHerHis] verstoßen. Er hat sich selbst zum "Sohn von Niemandem" ernannt. Ein frommer Anhänger der supremacistischen Ideale von [This.Species.GetName], der bereit ist, bis zum Äußersten zu gehen, um diese zu verwirklichen."
voq_catch_phrase:	"Ich diene dem Licht von Kahless. Ich bin in seinen Flammen wiedergeboren."
vorik_backstory:	"Geboren 2350, §Y[This.GetName]§! ist ein [This.Species.GetName] Ingenieur mit einer besonderen Begabung für die Konstruktion und Optimierung fortschrittlicher Antriebssysteme."
vorik_catch_phrase:	"Die Lösung muss sein, dass wir Partner werden. Das ist nur logisch!"
weyoun_backstory:	"§Y[This.GetName]' s§! Zu seinen ersten Aufgaben gehörten heikle Verhandlungen und das Sammeln von Informationen, wobei [This.GetHerHis] seine angeborene Fähigkeit, sich in komplexen politischen Landschaften zurechtzufinden, und [This.GetHerHis] sein unerschütterliches Engagement schnell die Aufmerksamkeit von [This.GetHerHis] Vorgesetzten auf sich zogen."
weyoun_catch_phrase:	"Das [Dominion] besteht seit über 2.000 Jahren und wird auch weiterhin bestehen bleiben."
william_riker_backstory:	"Geboren 2335, gehört §Y[This.GetName]§! zu den besten Offizieren der Generation [This.GetHerHis]. Er ist ein versierter Taktiker, dem die Entwicklung zahlreicher neuartiger und unorthodoxer Strategien zugeschrieben wird. Er ist bekannt unter dem Namen §Y"Will"§!."
william_riker_catch_phrase:	"An manchen Tagen erlegt man den Bären, an anderen Tagen erlegt der Bär einen."
worf_backstory:	"Geboren 2340, §Y[This.GetName]§!, Sohn von Mogh, ist ein [This.Species.GetName] Krieger von unerschütterlichem Mut, Integrität und Ehre. In der gesamten Gesellschaft [This.Species.GetName] bekannt. Ein Meister des Bat'leth, Mek'leth und Kur'leth."
worf_catch_phrase:	"Vielleicht ist heute ein guter Tag zum Sterben!"
yelgrun_backstory:	"Als einer der wenigen Vorta, die musikalisches Talent zeigen, ist §Y[This.GetName]§! ein kompetenter Diplomat und Verhandlungsführer."
yelgrun_catch_phrase:	"Nein, nicht in ein paar Minuten, jetzt! "
zek_backstory:	"§Y[This.GetName]§! gilt als einer der geschäftstüchtigsten [This.Species.GetName] der Geschichte. Als berühmter kommerzieller Pionier hat [This.GetSheHe] erfolgreiche Unternehmungen in neuen Märkten im gesamten Quadranten gestartet."
zek_catch_phrase:	"Man ergreift die Macht nicht, man sammelt sie still und leise, ohne dass es jemand bemerkt."
antaak_backstory:	"Geboren in eine Familie von Kriegern, §Y[This.GetName]§! wurde von seinem Vater [This.GetHerHis] wegen seiner Karriere als Wissenschaftler [This.GetHerHis] verstoßen. §Y[This.GetName]§! glaubt, dass es ehrenvoller ist, sein Leben der medizinischen Forschung zu widmen, als sinnlos zu sterben."
antaak_catch_phrase:	"Wenn ich zwischen Ehre und der Rettung von Menschenleben wählen muss, entscheide ich mich für Letzteres."
dnesh_keros_backstory:	"Zusammen mit [This.GetHisHer] Geschwistern ist §Y[This.GetName]§! ein ehemaliger Sklave, der dafür bekannt ist, auf einige seiner Landsleute eine berauschende Wirkung zu haben."
dnesh_keros_catch_phrase:	"Ich bin es gewohnt, mit Männern zusammen zu sein, die sich nehmen, was sie wollen."
erika_hernandez_backstory:	"Bekannt für [This.GetHerHis] seine unerschütterliche Entschlossenheit, sein taktisches Geschick und sein starkes Pflichtbewusstsein, §Y[This.GetName]§! ist ein Verfechter der Erforschung des Weltraums und der Aufrechterhaltung interstellarer Beziehungen. "
erika_hernandez_catch_phrase:	"Unter Bergsteigern gibt es einen alten Kodex. Was auf dem Berg passiert, bleibt auch dort."
gral_backstory:	"§Y[This.GetName]§! ist heute in offizieller Funktion tätig und war in mehreren historischen Konflikten eine wichtige militärische Persönlichkeit."
gral_catch_phrase:	" Ich glaube, wir haben mehr zu besprechen als nur Handelsstreitigkeiten."
harrad_sar_backstory:	"Als berüchtigter Freibeuter erlangte §Y[This.GetName]§! einen eher zweifelhaften Ruf unter seinen Piratenkollegen, als er [This.GetSheHe] einen Sklavenmarkt befreite."
harrad_sar_catch_phrase:	"Piraterie ist ein riskantes Geschäft. Ich bevorzuge den Handel."
joss_hayes_backstory:	"Nach seinem Abschluss an der Militärakademie in West Point, New York, §Y[This.GetName]§! absolvierte er ein Mondüberlebenstraining, eine extrem harte Tortur, die [This.GetHerHim] auf alles vorbereitet hat."
joss_hayes_catch_phrase:	"Wir sind alle Teil derselben Crew, egal welche Uniform wir tragen."
konsab_nijil_backstory:	"§Y[This.GetName]§! gehört zu den führenden Experten der [This.GetHerHis]-Ära auf dem Gebiet der Fernsteuerungstechnologien, obwohl er aufgrund seiner Sorge um das Wohlergehen der Testpersonen umstritten ist."
konsab_nijil_catch_phrase:	"Es ist einfacher, ein Gewebe zu entwirren, wenn man einen einzelnen Faden gezogen hat."
kvagh_backstory:	"§Y[This.GetName]§! ist dafür bekannt, dass er keine Zurückhaltung kennt, wenn es darum geht, [This.GetHerHis] Ziele zu erreichen. [This.GetSheHe] würde sich eher freiwillig melden, als sich auf die Handlungen anderer zu verlassen."
kvagh_catch_phrase:	"Wenn Sie hoffen, diesen Ort jemals verlassen zu können, schlage ich vor, dass Sie aufhören, Fragen zu stellen, und Ihre Arbeit wieder aufnehmen."
lela_yurani_backstory:	"§Y[This.GetName]§! ist ein angesehener [This.Species.GetName] Gesetzgeber. Mit eindringlichen Gesten wird oft gesagt, dass [This.GetSheHe] mit seinen Händen genauso viel spricht wie mit seiner Stimme [This.GetHerHis]."
lela_yurani_catch_phrase:	"Was ist ein Mensch anderes als die Summe seiner Erinnerungen?"
maras_motin_backstory:	 "Eine ehemalige Sklavin, §Y[This.GetName]§! erkannte, dass [This.GetHerHis] ihre enorme Intelligenz sie zu einer Bedrohung für [This.GetHerHis] Geschwister machen würde. Stattdessen [This.GetSheHe] lernte sie, eine dumme Maske zu tragen, um ihre Umgebung zu täuschen [This.GetHerHim]."
maras_motin_catch_phrase:	"Sind die lila Echsenmenschen noch unsere Freunde?"
navaar_passa_backstory:	" Kürzlich zusammen mit [This.GetHerHis] Geschwistern aus einem Sklavenmarkt befreit, kann §Y[This.GetName]§! nicht anders, als eine subtile Trotzhaltung an den Tag zu legen, während [This.GetSheHe] versucht, ein neues Leben zu beginnen."
navaar_passa_catch_phrase:	 "Meintest du das, als du sagtest, wir könnten ein neues Leben beginnen? "
talas_mirrin_backstory:	"Obwohl er in eine wohlhabende Familie hineingeboren wurde, führten Pflichtbewusstsein und militärische Tradition dazu, dass §Y[This.GetName]§! sich für ein Leben in [Owner.GetNavyNameDefinitive] entschied."
talas_mirrin_catch_phrase:	"Du hast den EPS-Synchronisator nicht zurückgesetzt. Du könntest dir die Augenbrauen versengen, wenn du ihn wieder in Betrieb nimmst."
tarah_okenga_backstory:	"Willensstark und durchsetzungsfähig, §Y[This.GetName]§! scheut sich nicht, für seine Überzeugungen zu kämpfen [This.GetHerHis]."
tarah_okenga_catch_phrase:	"Wir wollen nur die Chance, für das zu kämpfen, was uns zusteht."
telev_nras_backstory:	"Von Natur aus etwas sarkastisch, §Y[This.GetName]§! kann [This.GetHerHis] manchmal seine Aggressivität die Oberhand gewinnen lassen [This.GetHerHim]."
telev_nras_catch_phrase:	"Ich werde Ihnen jede Unterstützung zukommen lassen, die Sie benötigen."
thoris_vhendreni_backstory:	"Als Politiker mit Verhandlungsgeschick §Y[This.GetName]§! bezweifelt er, dass sozial gespaltene Planeten dauerhafte Allianzen eingehen können."
thoris_vhendreni_catch_phrase:	" Sie verwenden Wörter, die nicht im Universalübersetzer enthalten sind!"
tpol_backstory:	"Ein ehemaliger Geheimdienstoffizier, §Y[This.GetName]§! ist bekannt für [This.GetHerHis] seine Loyalität und sein Engagement für seine Pflicht."
tpol_catch_phrase:	"Es gibt einen Unterschied zwischen Aufgeschlossenheit und dem Glauben an etwas, weil man möchte, dass es wahr ist."
vlar_backstory:	" Der prominente Diplomat §Y[This.GetName]§! ist bekannt für [This.GetHerHis] sein Verhandlungsgeschick mit anderen Spezies."
vlar_catch_phrase:	"Eines Tages möchte ich einen Raum betreten, ohne dass es sich wie ein Staatsbesuch anfühlt."
vrel_catch_phrase:	"Disziplin ist die Grundlage der Führung."
vrel_backstory:	"[Root.GetName] ist ein Offizier, der sich streng an die Vorschriften hält und für [Root.GetHerHis] seine kompromisslose Disziplin und seine Abneigung gegen unnötige Risiken bekannt ist."
thylek_shran_backstory:	"In die Fußstapfen seiner Familie tretend, trat §Y[This.GetName]§! in die Armee ein und wurde als rücksichtsloser Kommandant bekannt, der keine Schulden unbeglichen lässt."
thylek_shran_catch_phrase:	"Trinken wir gemeinsam auf unsere gegenseitige Unzufriedenheit."
valdore_tr_irrhaimehn_backstory:	"Nachdem er wegen Infragestellung von Anweisungen aus einer hochrangigen politischen Position ausgeschlossen worden war, §Y[This.GetName]§! wandte er seinen strategischen Verstand einer militärischen Karriere zu."
valdore_tr_irrhaimehn_catch_phrase:	"Wir sind alle Soldaten, von dem Moment an, in dem wir geboren werden. Wenn wir das vergessen, laden wir das Unglück ein."
mark_wyatt_backstory:	"
mark_wyatt_catch_phrase:	"Vergessen Sie nicht das Wesentliche des Spiels. Es geht um die Trapezoids."
leah_brahms_backstory:	" Als Jahrgangsbester in Subraumphysik [This.GetHerHis] schloss §Y[This.GetName]§! sein Studium mit einem Doktorat in theoretischer Physik ab und wurde zu einem führenden Kopf in der Warp-Feldtheorie und ihren Anwendungen."
leah_brahms_catch_phrase:	"Wenn ich in meinen Ansichten etwas unnachgiebig wirke, dann deshalb, weil mir meine Arbeit so sehr am Herzen liegt."
rudolph_ransom_backstory:	"Als Spezialist für Exobiologie §Y[This.GetName]§! hat er ein Händchen dafür, innovative Lösungen für unlösbare Probleme zu finden und dabei Konfrontationen so weit wie möglich zu vermeiden."
rudolph_ransom_catch_phrase:	"Ich brauche jeden Einzelnen von Ihnen, damit Sie wie immer Ihr Bestes geben."
james_leyton_backstory:	" Als entschlossener Kommandant glaubt §Y[This.GetName]§!, dass ein guter Offizier die Befehlskette respektiert und die Befehle eines Vorgesetzten akzeptiert, unabhängig davon, ob er mit ihnen einverstanden ist oder nicht."
james_leyton_catch_phrase:	"Das Volk verdient eine starke Führung. Jemanden, der es beschützen kann."
william_ross_backstory:	"§Y[This.GetName]§! ist ein Kommandant mit taktischem Verstand und hat wiederholt gezeigt, dass [This.GetSheHe] in der Lage ist, strategische Pläne innerhalb einer Flotte mühelos zu koordinieren."
william_ross_catch_phrase:	"Inter arma enim silent leges."
alynna_nechayev_backstory:	" Mit seiner sachlichen Haltung und seiner Tendenz, direkt auf den Punkt zu kommen, ist §Y[This.GetName]§! ein vehementer Verfechter der Sicherheit für [This.GetHerHis] Menschen und hat eine Vorliebe für bularische Canapés."
alynna_nechayev_catch_phrase:	"Ihre Priorität ist es, das Leben der Bürger zu schützen, nicht mit Ihrem Gewissen zu ringen. "
kyle_riker_backstory:	"§Y[This.GetName]§! ist ein erfahrener ziviler Strategieattaché, der sich auf Grenzregionen spezialisiert hat. [This.GetSheHe] ist bekannt dafür, "hart wie Stahl" zu sein, und man kann sich immer darauf verlassen, dass er seine Arbeit erledigt."
kyle_riker_catch_phrase:	"Ich habe vielleicht einen gewissen Ruf für hervorragende Leistungen."
owen_paris_backstory:	" §Y[This.GetName]§! ist ein prinzipientreuer Kommandant, der seine Untergebenen [This.GetHerHis] dazu motiviert, in allem, was sie tun, Spitzenleistungen zu erbringen. Sobald [This.GetSheHe] eine Entscheidung getroffen hat, [This.GetSheHe] dazu, an seiner Meinung festzuhalten."
owen_paris_catch_phrase:	 "Ich weiß das zu schätzen, aber ich teile Ihre Vorliebe für holografische Ablenkungen nicht."
lance_cartwright_backstory:	"§Y[This.GetName]§! hat sich einen Namen gemacht, indem es hochrangige Beamte mit den neuesten Informationen und Updates versorgt. Hat ein scharfes Auge dafür, die Schwächen seiner Feinde auszunutzen."
lance_cartwright_catch_phrase:	"Die Gelegenheit hier besteht darin, sie in die Knie zu zwingen. Dann sind wir in einer weitaus besseren Position, um Bedingungen zu diktieren."
robert_wesley_backstory:	" §Y[This.GetName]§! ist ein angesehener, engagierter Kommandant, der [This.GetHerHis] sein taktisches Denken schärft, indem er regelmäßig Kriegsspiele mit den Schiffen unter seinem Kommando durchführt. "
robert_wesley_catch_phrase:	" Manchmal muss man das Risiko eingehen, dass sie nicht nur eine Falle stellen."
richard_galen_backstory:	"§Y[This.GetName]§! ist ein führender Kopf in der Archäologie, der gerne seine Faszination für die Ursprünge von Zivilisationen mit anderen teilt."
richard_galen_catch_phrase:	"Träume nicht von heute."
tristan_adams_backstory:	"Das Studium der Psychologie hat §Y[This.GetName]§! einige revolutionäre Ideen zur Behandlung von Gefangenen und zur Resozialisierung von Straftätern hervorgebracht. "
tristan_adams_catch_phrase:	"Ich weiß, dass ihr euch ohne Waffen genauso nackt fühlt wie wir ohne Medikit."
richard_daystrom_backstory:	"Als Wunderkind auf dem Gebiet der Computertheorie gilt §Y[This.GetName]§! konzentriert sich [This.GetHerHis] in seiner Forschung auf tiefe neuronale Netze, in der Hoffnung, eines Tages einen Durchbruch in dieser Technologie zu erzielen."
richard_daystrom_catch_phrase:	"Eine ziemlich beeindruckende Leistung für eine Maschine, finden Sie nicht auch?"
matthew_decker_backstory:	"Als emotionaler, aber engagierter Offizier §Y[This.GetName]§! hat sich intensiv für die Sicherheit seiner [This.GetHerHis] Crewmitglieder eingesetzt."
matthew_decker_catch_phrase:	"Der Kommandant ist für das Leben seiner Besatzung verantwortlich, ebenso wie für ihren Tod."
kelvar_garth_backstory:	"§Y[This.GetName]§! absolvierte die [This.GetHerHis] Militärausbildung als einem Musterschüler und beabsichtigt, sein Versprechen, neue Welten zu erforschen, einzulösen. [This.GetHerHis]"
kelvar_garth_catch_phrase:	"Galaxien umgeben uns, grenzenlose Weiten."
katrina_cornwell_backstory:	"Seine frühere Karriere als Therapeut ist §Y[This.GetName]§! sehr hilfreich, wenn es darum geht, Einblicke sowohl in die [This.GetHerHis] Crew als auch in die [This.GetHerHis] Gegner zu gewinnen."
katrina_cornwell_catch_phrase:	"Der einzige Weg, einen neuen Weg zu beschreiten, ist, ihn zu gehen."
brett_anderson_backstory:	"§Y[This.GetName]§! ist ein angesehener Militärführer, dessen Meinung oft von [This.GetHerHis]] anderen Offizieren eingeholt wird. [This.GetSheHeCap] verfügt über umfangreiche taktische Erfahrung, aber Verhandlungen sind nicht seine Stärke."
brett_anderson_catch_phrase:	"Wenn wir kämpfen, reden wir nicht."
robert_april_backstory:	"Geboren im Jahr 2195, §Y[This.GetName]§! genießt [This.GetHerHis] das uneingeschränkte Vertrauen seiner Kollegen und zeichnet sich durch eine unternehmungslustige Haltung aus, die zu einer langen und erfolgreichen Karriere führen könnte."
robert_april_catch_phrase:	""Monster" ist ein Wort, mit dem diejenigen beschrieben werden, die uns nicht verstehen."
tpragh_catch_phrase:	"Bitte versuchen Sie, Ihre Emotionen unter Kontrolle zu halten."
lwaxana_troi_backstory:	"Überlebensgroß und äußerst kokett, §Y[This.GetName]§! ist ein wohlhabender, extravaganter und schillernder Diplomat."
lwaxana_troi_catch_phrase:	"Das wahre Geschenk des Lebens ist die Fähigkeit, Freude zu genießen."
tam_elbrun_backstory:	" Während die meisten [This.Species.GetName] telepathischen Fähigkeiten während der Pubertät erworben werden, §Y[This.GetName]§! wurde mit [This.GetHerHis] voll entwickelten Fähigkeiten geboren. Da er die Gedanken anderer nicht ausblenden kann, [This.GetSheHe] Trost in den Gedanken nicht-humanoider Lebensformen."
tam_elbrun_catch_phrase:	 "Müssen Lebewesen einen Zweck haben? Oder existieren wir ohne Grund, nur um zu existieren?"
deanna_troi_backstory:	"Geboren 2336 als Kind eines menschlichen Vaters und einer betazoiden Mutter, verfügt §Y[This.GetName]§! über begrenzte telepathische Fähigkeiten, aber [This.GetHerHis] seine empathischen Fähigkeiten haben sich sowohl bei Beratungsgesprächen als auch bei diplomatischen Verhandlungen als unverzichtbar erwiesen."
deanna_troi_catch_phrase:	"Manchmal ist ein Kuchen einfach nur ein Kuchen."
elias_giger_backstory:	"Der umstrittene Wissenschaftler §Y[This.GetName]§! ist ein Befürworter der zellulären Langeweile-Theorie des Alterns."
elias_giger_catch_phrase:	"Willst du sterben?"
photonic_cube_catchphrase:	"Mit einer geraden Kante kommst du überall hin."
photonic_orb_catchphrase:	"Nimm das Leben, wie es kommt."
photonic_orbcube_catchphrase:	"Ausgewogen und geradlinig."
photonic_cube_backstory:	"§Y[This.GetName]§! ist ein Photonenwürfel aus der Veraflex-Nebelwolke, der derzeit im Rahmen eines Austauschprogramms für [Owner.GetName] tätig ist."
photonic_orb_backstory:	"§Y[This.GetName]§! ist ein Photonenorb aus dem Veraflex-Nebel, der derzeit im Rahmen eines Austauschprogramms für [Owner.GetName] tätig ist."
photonic_orbcube_backstory:	"§Y[This.GetName]§! ist ein Photonenkugel-Würfel aus dem Veraflex-Nebel, der derzeit im Rahmen eines Austauschprogramms für [Owner.GetName] tätig ist. "
james_moriarty_backstory:	"§Y[This.GetName]§! ist ein Photonenwesen, das auf [This.GetHerHis] namensgleich aus den Werken des Autors Arthur Conan Doyle basiert. \n\nNachdem [Root.GetSheHe] zufällig Bewusstsein entwickelt hatte, konnte es sich eine Existenz außerhalb des Holodecks aushandeln."
annorax_backstory:	" Mit seinem brillanten Verstand für Zeitmechanik hat §Y[This.GetName]§! mit seinen Theorien zur Manipulation des Raum-Zeit-Kontinuums einige Kontroversen ausgelöst."
annorax_catch_phrase:	" Wenn dir die Zeit eine Gelegenheit bietet, ignorierst du sie nicht."
dathon_backstory:	"Kinder von Tama. Sokath, seine Augen unbedeckt. Kira in Bashi. Darmok und Jalad auf dem Ozean. Der Weg nach Kamata im Frühling."
dathon_catch_phrase:	"Darmok und Jalad in Tanagra."
kayshon_backstory:	"Kinder von Tama. Unzak, als er die Florkas zu ihrem Schlafplatz führte. Das Leben in der Höhle von Garanoga. Karno im Wald mit Mira! Das Biest in Tanagra."
kayshon_catch_phrase:	"Rapunki, als er sich den Sieben anschloss."
danara_pel_backstory:	"§Y[This.GetName]§! ist ein talentierter Arzt, der sich auf Hämatologie spezialisiert hat, eine Fähigkeit, die [This.GetSheHe] bei der Behandlung von Krankheitsausbrüchen gut einsetzen kann."
danara_pel_catch_phrase:	"Manchmal denke ich, dass meine Leute so viel Zeit damit verbringen, Leben zu retten, dass sie nicht mehr wissen, wie man lebt."
mabor_jetrel_backstory:	" Berüchtigt sowohl unter [This.GetHerHis] Feinden als auch Verbündeten, betrachtet §Y[This.GetName]§! seine Rolle bei der Erfindung von Massenvernichtungswaffen als rein akademisch."
mabor_jetrel_catch_phrase:	"Etwas so Großes wie die Wissenschaft lässt sich nicht durch etwas so Kleines wie den Menschen aufhalten."
loskene_backstory:	" §Y[This.GetName]§! ist ein ernsthafter und direkter Befehlshaber, der keine Ausflüchte macht. [This.GetSheHeCap] erwartet von anderen, dass sie meinen, was sie sagen, und besteht auf Pünktlichkeit."
loskene_catch_phrase:	"Im Interesse der interstellaren werden wir genau eine Stunde und dreiundfünfzig Minuten warten. Aber seien Sie pünktlich. Wir dulden keine Täuschung."
phlox_ortan_backstory:	"Doktor §Y[This.GetName]§! hat eine bemerkenswerte medizinische Karriere hinter sich. Er begann als Militärarzt und erwarb schließlich ein Dutzend wissenschaftliche Abschlüsse, die von botanischer Pharmakologie über Zahnmedizin bis hin zu interspezifischer Veterinärmedizin reichen."
phlox_ortan_catch_phrase:	"Wenn Sie versuchen, neue Welten zu entdecken, müssen Sie versuchen, neue Ideen anzunehmen."
hitoroshi_kreel_catch_phrase:	"Es gibt ein altes Sprichwort: Wenn du in Fellebia bist, tu, was die Fellebianer tun."
bele_backstory:	" Mit seinem beeindruckenden Hintergrund in der Strafverfolgung hat sich §Y[This.GetName]§! als äußerst zielstrebig bei der Verfolgung einer Aufgabe erwiesen, selbst wenn das Endziel möglicherweise nicht mehr sinnvoll ist."
bele_catch_phrase:	"Es gibt eine Ordnung in den Dingen."
shukar_riin_backstory:	"Als vorausschauender Stratege haben sich sogar hochrangige Beamte in angespannten Situationen an §Y[This.GetName]§! gewandt, um [This.GetHerHis] Rat einzuholen."
shukar_riin_catch_phrase:	" Wir stellen die Fragen."
shras_endilev_backstory:	 "§Y[This.GetName]§! ist ein versierter [This.Species.GetName] Vertreter, der [This.GetHerHis] die wechselvolle Geschichte seines Volkes im Blick behält und gleichzeitig beim Aufbau dauerhafter galaktischer Allianzen hilft."
shras_endilev_catch_phrase:	"Vielleicht sollten Sie die Logik vergessen und sich ganz der Leidenschaft oder dem Gewinn hingeben."
lissan_backstory:	"Als er damit betraut wurde, für die [This.Species.GetName] zu sprechen, §Y[This.GetName]§! hat eine Vorliebe für den Einsatz [This.GetHerHis] telepathischer Fähigkeiten für eine effektive Diplomatie gezeigt, obwohl [This.GetSheHe] darauf besteht, dass es sich um einen einvernehmlichen Prozess handelt."
lissan_catch_phrase:	"Es würde Zeit sparen und unser Vertrauen stärken, wenn ich Ihre Gedanken erfahren könnte."
hemmer_backstory:	"Als begabter Ingenieur ist §Y[This.GetName]§! sogar so selbstbewusst, dass er sich selbst als Genie bezeichnet. [This.GetSheHeCap] sieht es als seine Lebensaufgabe an, "zu reparieren, was kaputt ist", und glaubt, dass der Tod erst kommt, wenn man den Sinn seines Lebens erfüllt hat."
hemmer_catch_phrase:	"Schaffe dir ein Zuhause unter anderen Menschen, und du wirst öfter Freude als Traurigkeit finden."
thelin_valrass_backstory:	 "§Y[This.GetName]§! ist ein angesehener Kommandant mit einem Gespür dafür, Missionen und persönliche Absichten in Einklang zu bringen. Trotz allem hinterfragt [This.GetSheHeCap] manchmal [This.GetHerHis] eigenes Schicksal."
thelin_valrass_catch_phrase:	"Ein kriegerisches Volk hat wenig Mitgefühl, aber wenn wir etwas empfinden, dann ist es für die Familie."
marouk_backstory:	 "§Y[This.GetName]§! ist ein unerschütterlicher Verhandlungsführer, aber hinter [This.GetHerHis] seiner entschlossenen Fassade verbirgt sich die Bereitschaft, die gewalttätige Vergangenheit des Volkes von [This.GetHerHis] zu versöhnen. "
marouk_catch_phrase:	"Ich habe nicht geglaubt, dass wir unsere Differenzen beilegen können. Jetzt bin ich überzeugt, dass es das Richtige ist, nicht nur für dich, sondern auch für uns."
klim_dokachin_backstory:	"§Y[This.GetName]§! ist ein anspruchsvoller [This.Species.GetName] Beamter, der sehr stolz auf jede Position ist, die [This.GetSheHe] ihm zugewiesen wurde. Obwohl er oft herrisch ist, erzählt [This.GetSheHe] immer gerne Geschichten über [This.GetHerHis] Heldentaten."
klim_dokachin_catch_phrase:	"Sie würden sich wundern, was ich alles an Bord dieser Schiffe finde. Einmal habe ich in einem Frachter in einem Schrank eine vier Meter lange caldorianische Aal gefunden. "
sirna_kolrami_backstory:	" §Y[This.GetName]§! ist ein Meisterstratege, der ebenso selbstbewusst Ratschläge erteilt wie [This.GetSheHe] ein Spiel von Strategema spielt."
sirna_kolrami_catch_phrase:	"Wenn man sich in einer überlegenen Position befindet, wird erwartet, dass man gewinnt."
shibolene_mress_backstory:	"Mit seinen Spezialgebieten Geschichte, Soziologie und Anthropologie hat §Y[This.GetName]§! seit seinem Abschluss schnell Karriere gemacht. In seiner Freizeit schreibt [This.GetHerHis] gerne freie Gedichte."
shibolene_mress_catch_phrase:	"Du bist witzig ... und für einen Menschen sehr attraktiv. "
kiki_tana_backstory:	"Die Fähigkeiten von Doktor §Y[This.GetName]§! in den Bereichen Wissenschaft und Medizin werden nur noch von ihrer vulgären Art am Krankenbett und ihrer Liebe zum Klettern und Rollenspielen übertroffen. "
kiki_tana_catch_phrase:	"Alles wird gut. Soll ich diese ekelhaften Narben reinigen?"
gor_backstory:	" Als energischer und imposanter [This.Species.GetName] Offizier lehnt §Y[This.GetName]§! die Idee, mächtige Allianzen zu schmieden, nicht ab, wenn dies weitere Möglichkeiten für [This.Species.GetName] Eroberungen bedeutet."
gor_catch_phrase:	"Sind Ihre Sicherheitsvorkehrungen normalerweise so unzureichend?"
pran_backstory:	"§Y[This.GetName]§! kam durch die dynastische Nachfolge seines Vaters [This.GetHerHis] an die Macht, nachdem dessen Tod [This.GetHerHis] seiner beiden älteren Brüder. [This.GetHerHisCap] Seine frühere Karriere als aggressiver und rücksichtsloser Befehlshaber kommt ihm §Y[This.GetName]§! in der Politik sehr zugute."
pran_catch_phrase:	"Nur Feiglinge ziehen sich zurück. Wir geben nicht auf."
berlinghoff_rasmussen_backstory:	"§Y[This.GetName]§!s Erscheinen aus der Zukunft war nur vorübergehend gedacht, um die Vergangenheit aus erster Hand zu studieren."
berlinghoff_rasmussen_phrase:	"Ich war nicht hier, um zu helfen. Ich war hier, um zu beobachten."
zalkat_dissident_phrase:	"Verdammt seien die Hufe von Malkus."
zalkat_dissident_backstory:	"Ein Dissident, der aus einer parallelen Quantenrealität geflohen ist, in der die Zalkat-Union bis in die Gegenwart Bestand hatte, [Root.GetName] ist entschlossen, seine [Root.GetHerHis] Schuld gegenüber dem [Owner.GetName] zu begleichen."
