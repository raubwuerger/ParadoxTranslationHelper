 GER_Goering_Plan:5 "Göring Four Year Plan"
 GER_Goering_Plan_desc:5 "The Four-Year Plan was an economic initiative which Hitler started. It involved, amongst other things, reducing unemployment and undertaking public works projects such as the German Autobahns. Hermann Göring was chosen to see the plan brought into action."
 GER_autobahn_I_tt:5 "Will begin a series of yearly improvements to Infrastructure"
 GER_autobahn_I_desc:5 "Since its inception in 1933, the autobahn project has been a glorious success. The construction efforts have reduced unemployment, and the wide roads stand as a monument to Germany's economic recovery. Much work remains to be done, however."
