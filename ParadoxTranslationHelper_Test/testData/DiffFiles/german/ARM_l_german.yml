ARM_event.1.t:0 "Der Tod des Katholikos Khoren I."
ARM_event.1.desc:0 "Heute trauert Armenien um Seine Heiligkeit Khoren I., den Katholikos aller Armenier, das geistliche Oberhaupt unserer alten Nation. Als Leitfigur für das armenische Volk in einer turbulenten Zeit widmete Katholikos Khoren sein Leben der Bewahrung unseres Glaubens, unserer Kultur und unserer Identität. Sein Rat und seine starke Führung waren der einzige Trost in Zeiten der Unsicherheit und Uneinigkeit. Man wird sich an ihn wegen seiner selbstlosen Hingabe an sein Heimatland und sein Volk erinnern. Armenien hat seinen Hirten verloren, die Nation betet für einen Nachfolger, der sein Vermächtnis ehren und weiterführen kann!"
ARM_event.1.a:0 "Der Verlust eines heiligen Mannes."
ARM_event.1.b:0 "Unbedeutend."

ARM_event.2.t:0 "Die [ARM.GetAdjektiv]-Freiwilligen wollen nach Hause!"
ARM_event.2.desc:0 "Die Freiwilligenverbände wurden gebildet, um [SOV.GetNameDef] zu bekämpfen und Armenien zu befreien. Mit der Niederlage des [SOV.GetAdjektiv]-Staates haben diese Freiwilligen das Gefühl, dass ihre Mission erfüllt ist, und sie wollen nach Hause geschickt werden."
ARM_event.2.a:0 "Überreden Sie sie, noch ein wenig zu bleiben."
ARM_event.2.b:0 "Lösen Sie ihre Einheit auf."

ARM_event.3.t:0 "Die Freiwilligen kommen nach Hause!"
ARM_event.3.desc:0 "Nach heldenhaften Kämpfen für die Befreiung unseres Vaterlandes von ausländischer Unterdrückung sind die Freiwilligen, die dem Aufruf zum Kampf für [ARM.GetNameDef] gefolgt sind, nach Hause zurückgekehrt. Sie zogen unter dem Jubel der Menge durch die Innenstadt."
ARM_event.3.a:0 "Wir haben uns selbst befreit!"

ARM_event.4.t:0 "Die große militärische Säuberung"
ARM_event.4.desc:0 "Iosif Stalin, der Führer der Sowjetunion, hat kürzlich Streiks und Verhaftungen vieler Politiker, Militärs und des Generalstabs der bolschewistischen Partei angeordnet. Daraufhin wurden auch die Armenier nicht verschont, da einige armenische Beamte, insbesondere Movses Silikyan und Christopher Araratyan, die in den 1920er Jahren für die Armenische Revolutionäre Föderation gekämpft hatten, ebenfalls verhaftet wurden, und zwar wegen antirevolutionärer Aktivitäten. Sie warten derzeit auf ihr Urteil, das wahrscheinlich die Todesstrafe sein wird, wenn man sich die anderen Fälle ansieht ..."
ARM_event.4.a:0 "Wir müssen vorsichtig sein, dies sind wirklich gefährliche Zeiten ..."
