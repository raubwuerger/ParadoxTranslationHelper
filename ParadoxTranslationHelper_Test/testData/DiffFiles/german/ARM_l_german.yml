ARM_return_from_exile:0 "Proklamiert die Zweite Republik"
ARM_return_from_exile_desc:0 "Armenien war einst frei, und mit der Rückkehr unserer Verwandten von ihren Zufluchtsorten wird es das wieder sein."
ARM_the_last_claimant:0 "Lade den Prinzen erneut ein"
ARM_the_last_claimant_desc:0 "Um den Ruhm unserer Vergangenheit wiederzuerlangen, müssen wir uns den Söhnen von Leo II. anschließen."
ARM_royal_guards:0 "Errichte die Dranik-Gund"
ARM_royal_guards_desc:0 "Wir müssen unsere besten Krieger als starke rechte Hand der Monarchie vereinen."
ARM_ensure_church_support:0 "Schart euch um Etschmiadsin"
ARM_ensure_church_support_desc:0 "Der Glaube ist das Feuer in den Herzen unseres Volkes. Die Apostolische Kirche muss dem neuen Monarchen zum Wohle aller [ARM.GetAdjektiv] zur Seite stehen."
ARM_reestablish_the_republic:0 "Wiedererrichtung des Hanrapetutyun"
ARM_reestablish_the_republic_desc:0 "Neue Technologien werden die Welt die Stimme Armeniens wieder hören lassen."
ARM_armenian_youth_federation:0 "Konsolidierung der Tseghagrons"
ARM_armenian_youth_federation_desc:0 "Die Bruderschaft der Tseghagrons ist das Fundament der Demokratie, und sie beginnt in den Herzen junger Männer."
ARM_implement_liberal_reforms:0 "Sozialreformen umsetzen"
ARM_implement_liberal_reforms_desc:0 "Um einen Kompromiss mit den Hunchaks zu erzielen, müssen wir sozialpolitische Maßnahmen und Reformen umsetzen."
ARM_mend_the_split:0 "Die Spaltung überwinden"
ARM_mend_the_split_desc:0 "Um unsere Nation zu vereinen, müssen wir schließlich unsere Innenpolitik vereinen."
ARM_reunify_the_armenian_people:0 "Das armenische Volk wiedervereinen"
