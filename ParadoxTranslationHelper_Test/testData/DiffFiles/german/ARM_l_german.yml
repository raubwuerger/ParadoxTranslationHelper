 # Starting Ideas # ""

ARM_fading_national_identity:0 "Schwund der nationalen Identität"
ARM_fading_national_identity_desc:0 "Das armenische Volk blickt auf eine lange und stolze Geschichte der Widerstandsfähigkeit zurück, die von seinem erbitterten Widerstand und tragischen Verlusten in den Kriegen der 1910er und 1920er Jahre geprägt ist. Nach den Schrecken der Jahre 1915–1916, die das armenische Volk durchmachte, und seinem Kampf ums Überleben während des Ersten Weltkriegs erlangte Armenien kurzzeitig die Unabhängigkeit, nur um Anfang der 1920er Jahre in die Sowjetunion eingegliedert zu werden. Jahrzehnte der Sowjetherrschaft haben die kulturelle Autonomie und das Nationalbewusstsein unseres Landes geschwächt. Unter der Politik der Kollektivierung und Unterdrückung der ethnischen Identität durch Moskau verblassten die Symbole des armenischen Erbes und Stolzes und wichen einer sowjetischen Identität, die der armenischen Geschichte und Tradition wenig Raum lässt. Heute steht Armenien an einem Scheideweg, an dem die Verbindung der Menschen zu ihren Wurzeln von Tag zu Tag schwächer wird und die Erinnerung an die hart erkämpften Kämpfe für Freiheit und Identität zu verblassen droht ..."

ARM_fading_national_identity_democratic:0 "Wiedergeburt der Republik"
ARM_fading_national_identity_democratic_desc:0 "Das armenische Volk blickt auf eine lange und stolze Geschichte der Widerstandsfähigkeit zurück, die von seinem erbitterten Widerstand und den tragischen Verlusten in den Kriegen der 1910er und 1920er Jahre geprägt ist. Nach den Schrecken der Jahre 1915–1916, die das armenische Volk erdulden musste, und seinem Kampf ums Überleben während des Ersten Weltkriegs erlangte Armenien kurzzeitig die Unabhängigkeit, nur um Anfang der 1920er Jahre in die Sowjetunion eingegliedert zu werden. Jahrzehnte der Sowjetherrschaft haben die kulturelle Autonomie und das Nationalgefühl unseres Landes untergraben. Im Zuge der Kollektivierungspolitik und der Unterdrückung der ethnischen Identität durch Moskau verblassten die Symbole des armenischen Erbes und Stolzes und wichen einer sowjetischen Identität, die der armenischen Geschichte und Tradition wenig Raum lässt. Heute steht Armenien an einem Scheideweg, an dem die Verbindung der Menschen zu ihren Wurzeln von Tag zu Tag schwächer wird und die Erinnerung an die hart erkämpften Kämpfe für Freiheit und Identität zu verblassen droht..."

ARM_fading_national_identity_right:0 "Triumph über den Bolschewismus"
ARM_fading_national_identity_right_desc:0 "Das armenische Volk blickt auf eine lange und stolze Geschichte der Widerstandsfähigkeit zurück, die von seinem erbitterten Widerstand und tragischen Verlusten in den Kriegen der 1910er und 1920er Jahre geprägt ist. Nach den Schrecken der Jahre 1915–1916, die das armenische Volk durchmachte, und seinem Kampf ums Überleben während des Ersten Weltkriegs erlangte Armenien kurzzeitig die Unabhängigkeit, nur um Anfang der 1920er Jahre in die Sowjetunion eingegliedert zu werden. Jahrzehnte der Sowjetherrschaft haben die kulturelle Autonomie und das Nationalbewusstsein unseres Landes geschwächt. Unter der Politik der Kollektivierung und Unterdrückung der ethnischen Identität durch Moskau verblassten die Symbole des armenischen Erbes und Stolzes und wichen einer sowjetischen Identität, die der armenischen Geschichte und Tradition wenig Raum lässt. Heute steht Armenien an einem Scheideweg, an dem die Verbindung der Menschen zu ihren Wurzeln von Tag zu Tag schwächer wird und die Erinnerung an die hart erkämpften Kämpfe für Freiheit und Identität zu verblassen droht ..."

