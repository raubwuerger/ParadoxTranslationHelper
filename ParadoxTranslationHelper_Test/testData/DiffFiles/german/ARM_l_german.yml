ARM_support_chemical_factories:0 "Errichtung von Chemiefabriken"
ARM_support_chemical_factories_desc:0 "Obwohl sich im Osten in Baku riesige Ölfelder befinden, sollten wir unsere eigenen Erdölquellen erschließen."
ARM_improve_construction_methods:0 "Unterstützung der Industrie in Eriwan"
ARM_improve_construction_methods_desc:0 "Um ein modernes Armenien zu schaffen, müssen wir lernen, auf neue Weise zu bauen."
ARM_expand_ararat_cement:0 "Erweiterung der Zementfabrik Ararat"
ARM_expand_ararat_cement_desc:0 "Wir haben die Zementfabriken in Ararat vom Makel des Kommunismus befreit. Jetzt müssen wir sie erweitern."
ARM_industrial_advancements:0 "Nationales Bildungsprogramm"
ARM_industrial_advancements_desc:0 "Der Weg in die Zukunft wird durch die Bemühungen der klügsten [ARM.GetAdjektiv] Köpfe geebnet."
ARM_expand_the_yerevan_university:0 "Ausbau der Universität Eriwan"
ARM_expand_the_yerevan_university_desc:0 "Der Universität Eriwan mangelt es an qualifiziertem Personal. Die Einstellung qualifizierter Mitarbeiter aus dem Ausland könnte unseren Studenten helfen."
ARM_plan_the_kajaran_mine:0 "Nutzung des Eisens von Zangezur"
ARM_plan_the_kajaran_mine_desc:0 "Neue wissenschaftliche Entwicklungen haben ergeben, dass die Mineralressourcen in der Nähe von Kajaran viel bedeutender sein könnten als bisher angenommen."
