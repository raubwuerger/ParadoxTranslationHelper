ARM_the_transcaucasian_accords_desc:0 ""
ARM_organize_the_institutions:0 "Erhalt unserer Nation"
ARM_organize_the_institutions_desc:0 ""
ARM_acquire_diaspora_funding:0 "Diaspora-Finanzierung sichern"
ARM_acquire_diaspora_funding_desc:0 ""
ARM_transfer_officers_of_armenian_descent:0 "Rückruf der Offiziere"
ARM_transfer_officers_of_armenian_descent_desc:0 "Die Pflicht ruft unsere Krieger nach Hause. Sie haben in ihrem Dienst im Ausland viel gelernt, aber ihr Volk braucht sie jetzt."
ARM_the_triumph_over_communism:0 "Triumph über die Bolschewisten"
ARM_the_triumph_over_communism_desc:0 "Die Bolschewisten haben uns in der Stunde der Not verraten. Wir müssen sie loswerden."
ARM_war_propaganda:0 "Armenier, vereint wie eine einzige Nation!"
ARM_war_propaganda_desc:0 "Keine Nation hat jemals ihre Freiheit erlangt, ohne bereit zu sein, das Blut der Invasoren zu vergießen."
ARM_planned_defense_policy:0 "Geplante Verteidigungspolitik"
ARM_planned_defense_policy_desc:0 "Jeder Tag, den wir mit Kriegsvorbereitungen verbringen, bewahrt unseren Söhnen und Töchtern wochenlange Freiheit."
ARM_build_the_bek_line:0 "Errichtung der Davit-Bek-Linie"
ARM_build_the_bek_line_desc:0 "Die Erde, auf der General Bek einst Blut vergoss, ist stark und wird den Grundstein unserer Verteidigung bilden."
ARM_saint_gregory_protects_our_skies:0 "Der Heilige Gregorius beschützt unseren Himmel"
ARM_saint_gregory_protects_our_skies_desc:0 "Der Heilige wird unsere Werke segnen, solange sie in ehrlichem Glauben errichtet werden."
ARM_cherish_what_we_have:0 "Kaukasien ist unsere Heimat"
ARM_cherish_what_we_have_desc:0 "Dies ist der Ort unserer Väter, und ihrer Väter, und ihrer Väter vor ihnen, seit Jahrhunderten. Wir werden ihn ihres Erbes würdig machen."
ARM_irano_persian_diplomats:0 "Irano-persische Diplomaten"
ARM_irano_persian_diplomats_desc:0 "Der Feind unserer Feinde könnte ein guter Nachbar sein.  Wir sollten unserem südlichen Nachbarn die Hand reichen."
ARM_join_iran:0 "Beitritt [PER.GetNameDef]"
ARM_join_iran_desc:0 "Persien nahm unsere Flüchtlinge in dunklen Tagen auf. Wir sollten jetzt an ihrer Seite stehen, wenn die Asche der Welt zu Flammen wird."
ARM_the_wilsonian_promise:0 "Das Wilson'sche Versprechen"
ARM_the_wilsonian_promise_desc:0 "Einst glaubte die Welt, dass Trabzon, Erzurum und der Vansee zu Armenien gehörten. Sie hatten Recht."
ARM_operation_nemesis_wasn_t_enough:0 "Operation Nemesis wieder aufnehmen"
ARM_operation_nemesis_wasn_t_enough_desc:0 "Die Türken haben unsere Mütter und Väter zu Tausenden abgeschlachtet. Unsere gerechte Rache ist noch nicht vollendet."
ARM_assimilation:0 "Assimilation"
ARM_assimilation_desc:0 "Vergeltung verlangt nicht, dass wir wie unser Feind werden. Wir werden die Besiegten besser behandeln, als wir behandelt wurden."
ARM_strong_hand:0 "Eine starke Hand"
ARM_strong_hand_desc:0 "Das Land, über das wir jetzt herrschen, gehört den Armeniern und nur den Armeniern."
ARM_an_open_hand_to_turkey:0 "Versöhnung mit Anatolien anstreben"
ARM_an_open_hand_to_turkey_desc:0 "Trotz all ihrer Übel sind Atatürks Revolutionäre nicht die Osmanen von einst und könnten uns im Kampf gegen die Bolschewisten unterstützen."
ARM_hayk_youth:0 "Gründung der Vrevits Banak"
ARM_hayk_youth_desc:0 "Um unsere Expansionsbestrebungen zu verwirklichen, müssen wir die "Armee der Vergeltung" aufstellen, besser bekannt als "Vrevits Banak"."
ARM_repression_apparatus:0 "Politische Loyalität sicherstellen"
ARM_repression_apparatus_desc:0 "Diejenigen, die nicht auf unserer Seite stehen, sind keine treuen Armenier und entsprechen nicht dem Willen des Volkes."
