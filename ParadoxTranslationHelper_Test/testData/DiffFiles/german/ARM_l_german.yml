ARM_fund_the_armenian_workers_union:0 "Finanzierung der Armenischen Arbeitergewerkschaft"
ARM_fund_the_armenian_workers_union_desc:0 ""
ARM_workers_propaganda:0 "Arbeiterpropaganda"
ARM_workers_propaganda_desc:0 "Die Bourgeoisie der Ersten Republik hat das armenische Volk im Stich gelassen. Das Volk muss sich gegen die Übel des Kapitalismus zusammenschließen oder erneut dasselbe Schicksal erleiden."
ARM_ambitious_production_quotas:0 "Nationalisierung der Industrie"
ARM_ambitious_production_quotas_desc:0 "Gemeinsam ist die Macht des Volkes unaufhaltsam. Vereint können wir Armenien zu neuen Höhen führen, wie es sie noch nie zuvor gegeben hat."
ARM_army_propaganda:0 "Militärpropaganda"
ARM_army_propaganda_desc:0 "Gemeinsam können die Volkssoldaten [ARM.GetNameDef] vor der Diktatur der Bourgeoisie Europas und der osmanischen Tyrannen schützen."
ARM_protect_the_revolution:0 "Die Revolution schützen"
ARM_protect_the_revolution_desc:0 "Die Lehren von Marx und Lenin werden die Übel des Kapitalismus aus der Welt verbannen. Aber wir müssen uns dem großen Kampf des Volkes anschließen und Opfer bringen, um den Funken der Revolution zu bewahren."
ARM_enforce_state_atheism:0 "Staatlichen Atheismus durchsetzen"
ARM_enforce_state_atheism_desc:0 "Der Heilige Gregor und seine Kirchen sind kaum mehr als ein Werkzeug der Bourgeoisie, um die Menschen dahingehend zu indoktrinieren, ihre angeborene Macht und ihren Reichtum aufzugeben."
ARM_reopen_etchmiadzin_seminary:0 "Staatlich anerkannte Religion"
ARM_reopen_etchmiadzin_seminary_desc:0 "Gott und der Heilige Gregor stehen dem Volk von [ARM.GetNameDef] zur Seite, und der Katholikos kann dem Volk auf seinem Weg zur Gleichberechtigung helfen."
