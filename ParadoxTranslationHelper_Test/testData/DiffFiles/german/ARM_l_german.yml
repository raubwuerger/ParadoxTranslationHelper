 # Dashnak-Hunchak Split # ""

ARM_dashnak_hunchak_split:0 "Dashnak-Hunchak-Spaltung"
ARM_dashnak_hunchak_split_desc:0 "Die [ARM.GetDemocraticParty] und die Sots'ial Demokrat Hnch'akyan Kusakts'ut'yun (Hunchaks) kämpften einst Seite an Seite für die Unabhängigkeit und Rechte der Armenier, doch im Laufe der Zeit traten ideologische Differenzen zwischen ihnen zutage. Während die Daschnaken den armenischen Nationalismus und die Unabhängigkeit betonen, legen die Hunchaks den Schwerpunkt auf sozialistische Ideale, die Zusammenarbeit mit den Sowjets und bevorzugen oft Bündnisse, die umfassenderen revolutionären Zielen dienen. Diese Spaltung hat Zwietracht in die armenische Politik gesät, da beide Parteien ihre unterschiedlichen Visionen für die Zukunft Armeniens vehement verteidigen. Jetzt, da die Nation neuen Bedrohungen und Chancen gegenübersteht, drohen interne Rivalitäten die Einheit zu behindern, wenn sie am dringendsten benötigt wird, wodurch Armenien gespalten und anfällig für Einfluss von außen wird."

