ARM_socialist_governmental_autonomy:0 "Gründung der Armenischen SSR"
ARM_socialist_governmental_autonomy_desc:0 "Die Auflösung der Transkaukasischen Sozialistischen Föderativen Sowjetrepublik bietet uns die Möglichkeit, unser Volk zu stärken."
ARM_party_involvement:0 "Die sozialistische armenische Identität"
ARM_party_involvement_desc:0 "Das Versagen der Bolschewisten bestand darin, Armenien für ihre Zwecke auszubeuten, anstatt das armenische Volk zu stärken. Wir werden nicht denselben Fehler begehen."
ARM_purge_the_trotskyist_dashnaks:0 "Säuberung der trotzkistischen Daschnaks"
ARM_purge_the_trotskyist_dashnaks_desc:0 ""
