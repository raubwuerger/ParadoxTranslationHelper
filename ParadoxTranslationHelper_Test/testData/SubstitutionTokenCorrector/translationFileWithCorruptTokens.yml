wtt_prc.31.desc:0	"Unter dem Schutz der Nacht ist es unseren Genossen in [JAP.GetManchuriaPuppet] gelungen, eine wichtige Brücke zu sabotieren. Die kleine Kommandoeinheit berichtet, dass die Brücke vollständig zerstört wurde und beim Einsturz einen Munitionszug mit sich riss. \n\n|___TAB___|Sie haben darauf geachtet, von den Einheimischen gesehen zu werden, um deutlich zu machen, dass es sich um einen Sabotageakt handelte. Es bleibt abzuwarten, ob dies die Japaner zum Handeln veranlassen wird."
