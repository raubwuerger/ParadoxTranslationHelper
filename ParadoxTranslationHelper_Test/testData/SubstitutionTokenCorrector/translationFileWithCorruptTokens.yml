cairoC.6.d_noUS:0	"Obwohl es [USA.GetLeader]s Idee war, endet die Konferenz mit einem leeren Platz für [USA.GetLeader]. [CHI.GetLeader] und [ENG.GetLeader] haben eine Einigung erzielt, die [USA.GetLeader] nicht akzeptieren konnte. [ENG.GetLeader] scheint jedoch ziemlich empört darüber zu sein, dass [CHI.GetName] aus den Bedingungen einen politischen Vorteil ziehen könnte.|___NL 000663___|\nEinige Experten sagen, dass diese Konferenz bedeuten würde, dass sich die Beziehung zwischen [ENG.GetName] und [USA.GetName] in den folgenden Jahren recht schnell verschlechtern und sogar zu Blöcken innerhalb der demokratischen Welt führen könnte."
cairoC.6.d_suc_2:0	"Alle eingeladenen Staats- und Regierungschefs haben nach ausführlichen Diskussionen eine Einigung über eine engere Zusammenarbeit gegen die Bedrohung durch [JAP.GetAdjective] erzielt. Einige Experten sagen, diese Konferenz würde den Untergang von [JAP.GetName] in nicht allzu ferner Zukunft bedeuten, da zwei der mächtigsten Nationen der Welt beschlossen haben, gemeinsam gegen |___NS00061 9___| gemeinsam entgegenzutreten. Sollte dies zutreffen, könnte [JAP.GetAdjective] eine schwere Zeit bevorstehen."
france.60.d:0	 "Heute, gerade als sich die [Root.GetRulingParty] Führung und die Armee auf einen landesweiten Aufstand vorbereiteten, stellten einige Beamte der [Root.GetAdjective] Regierung [Root.GetLeader] rasch unter Hausarrest und nahmen Verhandlungen mit den Kommunisten auf.\n|___NL00070 8___|Unter dem Vorwand, die Ordnung zu wahren, liefen die Verhandlungen in Wirklichkeit darauf hinaus, denjenigen, die sich zur Zusammenarbeit entschlossen hatten, Positionen innerhalb des neuen sozialistischen Staates zu sichern. Der Putsch war vollendet, bevor irgendjemand etwas unternehmen konnte, um ihn zu verhindern, und diejenigen, die dies versucht hätten, sind nun vom neuen Regime inhaftiert, ins Exil geschickt oder hingerichtet worden."
