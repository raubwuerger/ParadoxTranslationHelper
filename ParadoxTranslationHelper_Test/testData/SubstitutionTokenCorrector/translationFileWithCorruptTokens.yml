spain.23.d:0	"Trotz unserer Zurückhaltung hat Berlin unsere bescheidenen Forderungen nach Hilfe und symbolischer territorialer Anerkennung zurückgewiesen. [SPA.GetLeader] ist fassungslos – nicht über das Ausmaß der Ablehnung, sondern vom Prinzip. Selbst eine zurückhaltende Zusammenarbeit, so scheint es, wird von der Achse nicht belohnt.\nIn Burgos und Madrid verdüstert sich der Ton. Während wir offiziell neutral bleiben, überdenkt Spanien nun die Kosten einer Annäherung. Wenn Großbritannien und Amerika weiterhin Unterstützung leisten, spielt das Reich vielleicht keine Rolle mehr.\nDie Falange knurrt – doch |___NS 002321___| schweigt."
