##### |___KY025 902___|„Die Vereinigten Staaten treten in den Krieg ein!“ 
news.20.d:0	"Selbst angesichts deutscher Truppen an ihrer Grenze hat [LIT.GetNameDef] ein von Berlin gestelltes Ultimatum zur Rückgabe des Gebiets Memel zurückgewiesen. \n\nMemel gehörte einst zu Ostpreußen, wurde jedoch |___NS00 2402___| nach dem Versailler Vertrag annektiert. Es sei die Integrität des Vertrags, [LIT.GetLeader] die es zu schützen gelte, erklärte die [LIT.GetAdjective] Regierung, als sie ihre Ablehnung bekanntgab.\n\nInternationale Beobachter rechnen nun damit, dass Deutschland versuchen könnte, das Gebiet mit Gewalt einzunehmen.. ."
news.69.d:0	" Seit dem Machtantritt der [From.GetRulingParty] hat [From.GetNameDef] auf engere Beziehungen zu [SOV.GetNameDef] hingearbeitet und ist nun selbst der Union beigetreten.\n\nVor wenigen Tagen hat die |___NS0 02415___| die Kontrolle über das Land offiziell an [SOV.GetNameDef] als integrierten Oblast übergeben.\n\nSowjetische Beamte weigern sich, die jüngste Eingliederung von [From.GetNameDef] als aggressiv zu bezeichnen, und behaupten, dass die "Integration des Territoriums" ohne jeglichen Druck von außen erfolgt sei."
news.70.d:0	"Seit dem Machtantritt der [baltic_annexation.GetRulingParty] hat [baltic_annexation.GetNameDef] auf engere Beziehungen zu [SOV.GetNameDef] hingearbeitet.\n|___NL00323 4___|Obwohl [baltic_annexation.GetLeader] weiterhin im Amt ist, werden Minister aufgrund ihrer Loyalität gegenüber [SOV.GetNameDef] ausgewählt, und ein großer Teil der Souveränität des Landes wurde aufgegeben. Sowjetische Beamte erklären, dass [baltic_annexation.GetName] lediglich Schutz sucht, als Reaktion darauf, dass Europa für kleinere Nationen zunehmend unsicherer wird.\n\n[SOV.GetNameDef] bekräftigte zudem, dass man bereit sei, einen solchen " Schutz" auf jeden Staat auszuweiten, der sich von Nachbarländern bedroht fühle."
news.113.d:0	"Jubelnde italienische Soldaten marschierten heute in Kairo ein, kurz nachdem sich die letzten britischen Einheiten aus der Stadt zurückgezogen hatten. \n\nSofort wurde eine Siegesparade organisiert, und italienische Soldaten strömten zu den Großen Pyramiden von Gizeh, um sich vor den berühmten Sehenswürdigkeiten fotografieren zu lassen.\n\nMit Kairo unter seiner Kontrolle ist |___NS002426 ___| ist nun einen Schritt näher daran, Italienisch-Ostafrika mit Italienisch-Libyen zu verbinden und eine zusammenhängende Kolonie in Afrika zu bilden."
##### |___KY026 072___|„Italien scheint die Kontrolle über Gibraltar zu haben, nachdem es Berichten zufolge zu heftigen Kämpfen rund um den Felsen und den Hafen gekommen war. Aus den tief unter dem Felsen verlaufenden Militärstollen sind noch immer vereinzelte Explosionen zu hören, doch italienische Beamte behaupten, jeglicher organisierte Widerstand sei beendet.|___NL003290___||___NL003291___|Da dieses wichtige Tor zum Mittelmeer nun unter italienischer Kontrolle steht, wird es für die britischen Seestreitkräfte schwierig werden, der Regia Marina in der Region Paroli zu bieten.“
##### |___KY0261 09___|„Dies könnte der Beginn eines weiteren Großen Krieges sein“
news.175.d:0	"Unter Berufung auf die während des Ersten Weltkriegs geschmiedeten Bande hat Frankreich ein formelles Bündnis mit Großbritannien beantragt und dabei nicht näher bezeichnete Bedrohungen für die Stabilität Europas angeführt.\n\nHeute wurde ihr Antrag vom britischen Parlament genehmigt, und Frankreich ist dem |___NS002 478___|."
news.188.d:0	" Trotz jahrzehntelanger Konflikte und diplomatischer Manöver um die Vorherrschaft im Mittelmeerraum beginnen [ITA.GetName] und [TUR.GetName], ihre Differenzen hinter sich zu lassen.\n\nIn einer Vereinbarung zur Zusammenarbeit "zum Wohle des gesamten Mittelmeerraums" |___NS 002509___| und [TUR.GetName] verpflichten sich, engere diplomatische Beziehungen zu gewährleisten, als sie seit der modernen Gründung der beiden Nationen jemals bestanden haben."
##### |___KY 026306___|„Werden sie wirklich eine Intervention riskieren?“
news.248.d:0	"\nNach zunehmendem diplomatischem Druck seitens [CAN.GetNameDef] hat [ENG.GetNameDef] die Gebiete Labrador und Neufundland an den [CAN.GetAdjective] Staat abgetreten. Es war seit langem das Ziel der |___NS 002683___|, "alle rechtmäßigen [CAN.GetAdjective] Gebiete zu vereinen", ein Ziel, dessen Verwirklichung nun einen Schritt näher gerückt ist.\n\nNatürlich bleibt die unbeantwortete Frage, was "rechtmäßiges [CAN.GetAdjective]" Gebiet ausmacht. Sowohl [ENG.GetNameDef] als auch der gesamte nordamerikanische Kontinent werden von nun an mit einem offenen Auge schlafen."
news.265.desc:0	"Nach der vernichtenden Niederlage, die Frankreich in seinem Heimatland erlitten hat, ist die Legitimität seines Kolonialreichs in Frage gestellt worden. Die Regierungen von [SOV.GetNameDef] und [SAF.GetNameDef] haben eine gemeinsame Erklärung abgegeben, in der sie erklären, dass man Frankreich die Aufrechterhaltung der Ordnung in Madagaskar nicht länger anvertrauen könne, und fordern, dass die Insel an [SAF.GetNameDef] übergeben werde. \n|___NL0 03445___|Die freie französische Regierung ist zusammengetreten, um die Angelegenheit zu erörtern. Verteidigungsexperten halten es für unwahrscheinlich, dass die dezimierten französischen Streitkräfte in der Lage wären, die Insel zu verteidigen, sollte es zu einem Krieg kommen."
news.270.desc:0	"Der neue Bob-Semple-Panzer der neuseeländischen Streitkräfte rumpelt die Hauptstraße der Hauptstadt entlang und ist ein wahrer Beweis für den Einfallsreichtum und den Kampfgeist des [NZL.GetAdjective] Volkes. Ausgestattet mit sechs Maschinengewehren und gepanzert mit einer mit ziemlicher Sicherheit kugelsicheren Eisenverkleidung wird er höchstwahrscheinlich das größte Hindernis sein, das ein Angreifer überwinden muss. \n\nEinige sogenannte Experten führen die mäßige Leistung und die schwache Bewaffnung des Fahrzeugs als Gründe dafür an, warum es nicht gebaut werden sollte, doch wie Premierminister |___NS00270 5___| während der offiziellen Übergabezeremonie des Fahrzeugs sagte, ist die rechtzeitige Verteidigung des Reiches von solcher Bedeutung, dass eine perfekte Ausrüstung weder erwartet noch gefordert werden kann."
news.281.desc:0	 "In einer gemeinsamen Erklärung verkündeten ein sichtlich erschütterter [ENG.GetAdjective] Außenminister zusammen mit dem [SOV.GetAdjective] Botschafter, dass Indien unverzüglich die volle Souveränität über seine eigenen Angelegenheiten erhalten werde. Es ist nicht ganz klar, welche Rolle [SOV.GetNameDef] bei dieser plötzlichen Änderung der [ENG.GetAdjective] Politik gespielt hat, doch sie scheint von Bedeutung zu sein.\n\nEine der ersten Maßnahmen der neuen indischen Führung war die Ankündigung einer engeren Zusammenarbeit mit |___NS0027 11___| anzukündigen, was den Gerüchten, dass [SOV.GetNameDef] zu ihren Gunsten interveniert habe, zusätzliches Gewicht verlieh."
ace_promoted.1.d:0	"Nur wenige gehen so viele Risiken ein wie die tapferen Piloten der [ROOT.GetAdjective] Luftwaffe. [From.GetName] [From.GetSurname], ein erfahrener Pilot, bekannt unter dem Rufzeichen [From.GetCallsign], hat sich [From.GetHerselfHimself] nicht nur dadurch ausgezeichnet, dass er lebend von der jüngsten Mission über [From.GetMissionRegion] zurückgekehrt ist, sondern auch durch bedeutende Siege in vielen kritischen Gefechten.\n\nAls leuchtendes Beispiel für [ROOT.GetAdjective] Mut wird |___NS00 2724___| wurde in den Medien ausführlich behandelt. Auch wenn die Menschen den Krieg eher als Hölle denn als Ruhm betrachten mögen, sind viele froh zu sehen, dass es noch Helden gibt, hinter denen sie stehen können. "
ace_promoted.1.d_major:0	"Nur wenige gehen so viele Risiken ein wie die tapferen Piloten der [ROOT.GetAdjective] Luftwaffe. [From.GetName] [From.GetSurname], ein erfahrener Pilot, bekannt unter dem Rufzeichen [From.GetCallsign], hat sich |___NS0 02729___| nicht nur dadurch, dass er lebend zurückkehrte, sondern auch durch das Steuern von [From.GetHerHis] [From.GetWing] mit großem Geschick. Vor kurzem war [From.GetName] auf einer Mission über [From.GetMissionRegion] und trug entscheidend zum Erfolg dieses kritischen Einsatzes bei.|___NL00346 4___|\nAls leuchtendes Beispiel für [ROOT.GetAdjective] Mut wurde [From.GetName]s jüngste Beförderung in den Medien ausführlich behandelt. Auch wenn die Menschen den Krieg eher als Hölle denn als Ruhm betrachten mögen, sind viele froh zu sehen, dass es noch Helden gibt, hinter denen sie sich versammeln können."
aces_killed_each_other.1.d_major:0	"Während der letzten Mission geriet unser berühmter [From.GetAceType]-Ass [From.GetFullname] in einen langwierigen Kampf mit dem gefürchteten Ass-Piloten [Prev.GetFullName]. Da ihm die Munition ausging und es keine Fluchtmöglichkeit gab, [From.GetCallsign] manövrierte [From.GetHerHis] [From.GetWingShort] durch das Feuer der [Prev.Owner.GetAdjective] Flugzeuge und rammte [Prev.GetCallsign].\nSowohl |___NS002 771___|s [From.GetWingShort] und [Prev.GetCallsign]s [Prev.GetWingShort] wurden gesichtet, wie sie in Trümmern über [From.GetMissionRegion] abstürzten. \n\nZwar ist es ein kleiner Trost, dass die [Prev.Owner.GetAdjective] Bedrohung, [Prev.GetCallsign], uns nicht länger belästigen wird, doch haben wir eine geschätzte Persönlichkeit des öffentlichen Lebens und eine Inspiration für alle [From.Owner.GetAdjective] verloren."
##### |___KY 026471___|„Wahl: Faschistische Mehrheit“
##### |___KY026587 ___|„Staatsstreich“
##### |___KY02 6682___|„Tod den Faschisten!“
war_justification.14.d:0	"'[From.GetName] mögen sich für moderner und fortschrittlicher halten als wir, doch die Wahrheit ist, dass ihre Nation nicht so auf die Probe gestellt wurde wie die unsere, noch sind sie auf die Bedrohungen vorbereitet, die sich nun deutlich am Horizont abzeichnen. Durch ihre Verachtung uns gegenüber und dadurch, dass sie uns daran hindern, das zu ergreifen, was uns rechtmäßig zusteht, haben sie uns zu einer dieser Bedrohungen für sich selbst gemacht. Ihre schwache und gespaltene Nation wird unseren Ansprüchen kaum widerstehen können. '\n\nDie spöttische Meinung von [From.GetName], die seit langem von den [ROOT.GetRulingParty] vertreten wird, hat sich von Kritik zu Feindseligkeit entwickelt. Obwohl die allgemeine Meinung lautet, dass das [From.GetAdjective] Volk einen Krieg vermeiden möchte, |___NS00 2897___| behauptet, dass ihre gewählten Führer ihn durch ihre Arroganz provoziert haben."
war_justification.16.d:0	" "Meine Gegner möchten Ihnen weismachen, dass meine Herrschaft derjenigen der [From.GetRulingParty] in [From.GetName] gleicht. Sie könnten nicht falscher liegen. Während die Erfolge von [From.GetLeader] das Ergebnis einer vorübergehenden Modeerscheinung sind – einer zerstörerischen Massenbewegung, die darauf aus ist, andere Nationen zur Unterwerfung zu zwingen –, steht das [ROOT.GetRulingParty] dieser Bewegung als diejenigen entgegen, die sich nicht unterwerfen werden. Ich bin bereit, alles Notwendige zu tun, um diese Bedrohung zu beseitigen, selbst wenn dies Krieg bedeutet."\n\nDas [ROOT.GetLeader]-Regime verfolgt eine feindselige Politik gegenüber der |___NS00 2914___|-Nation. Wie auch immer unsere Führer genannt werden mögen, "Faschist" ist ein Wort, das unseren Feinden vorbehalten ist."
##### |___KY0 26701___|„Unabhängig davon müssen wir das Volk auf den Krieg vorbereiten.“
war_justification.20.d:0	"Wenn wir uns den strategischen Vorteil in dem absehbaren, um nicht zu sagen unvermeidlichen Krieg mit [From.GetName] sichern wollen, gibt es keinen Raum für Zögern. Es geht darum, die Zukunft unserer Kinder zu sichern und zu gewährleisten, dass [ROOT.GetName] einen Platz in der Welt von morgen hat. Dies ist eine Frage der Hingabe an unsere Sache und an die Ideale, die wir für selbstverständlich halten. Es ist Zeit zu handeln."\n\nEine Reihe mitreißender Reden von |___NS002932 ___|, allen voran [ROOT.GetLeader], hat die Öffentlichkeit dazu aufgerufen, eine Invasion von [From.GetName] zu unterstützen. Die geopolitischen Motive hinter der Invasion treten in der Rhetorik gegenüber patriotischen Gefühlen in den Hintergrund, doch diese Kampagne scheint äußerst wirksam zu sein, um die Öffentlichkeit von ihrer Notwendigkeit zu überzeugen. "
war_justification.215.d:0	"Der [From.GetAdjective] Nationalgeist ist stark, doch nicht alle Nationen haben dieses Glück. [ROOT.GetName] hat seine Traditionen zerstört und seine rechtmäßigen Herrscher längst ermordet und begraben gesehen, alles im Namen der Idee der großen marxistischen Revolution. Es ist unsere Pflicht, die Ordnung in dieser Welt wiederherzustellen, die von blutrünstigen Usurpatoren in die Irre geführt wurde, und die Stärke von [From.GetName] gegen diese Bedrohung zu behaupten."\n\nWährend sich das [From.GetRulingParty] stets gegen den Kommunismus gestellt hat, |___NS003000 ___| in jüngsten Reden jedoch Ziel besonders heftiger Angriffe. Aus Angst vor dem unvermeidlichen Fortschritts in die nächste Phase der Geschichte ist ein Präventivschlag gegen den [ROOT.GetAdjective]-Kommunismus bereits in Vorbereitung."
nuke_dropped.8.d:0	"Heute wurde über der Hauptstadt der Vereinigten Staaten eine Atombombe gezündet. Bei einem Angriff, der eindeutig auf das politische Zentrum und das historische Erbe der USA abzielte, wurden das Weiße Haus, das Kapitol sowie eine Reihe von Denkmälern und Gedenkstätten von ihrem Feind, [?global.nukecountry.GetNameDef], von der Erde getilgt. Selbst der Brand von Washington vor über einem Jahrhundert verblasst im Vergleich zu der Zerstörung, die diese verheerende Waffe über die Stadt gebracht hat.\n|___NL003 569___|Obwohl Präsident [From.From.Owner.GetLeader] in Sicherheit gebracht wurde, ist die Nation bis ins Mark erschüttert. Zweifellos hofften die USA, das erste und einzige Land zu sein, das eine solche Waffe einsetzen könnte. Diese Hoffnungen sind nun auf die schlimmste Weise zerschlagen worden."
##### |___KY026 823___|„Einladung zum Völkerbund“
##### |___ KY026898___|„In der Erkenntnis, dass manchmal auch die Starken Verbündete brauchen, hat uns die |___NS003082___| eingeladen, der |___NS003083___| beizutreten. Wenn wir uns dafür entscheiden, dies anzunehmen, könnte uns dies durchaus reichlich Gelegenheit bieten, unseren Platz an der Sonne zu finden.“
hungary_flavor_territory.401.d:0	"Wir haben kürzlich Gebiete in der Region Burgenland erworben, die historisch gesehen Teil unserer Nation ist. Ein bedeutender Teil der Bevölkerung ist jedoch nicht |___NS 003220___|, und daher können wir sie nicht ohne Weiteres zum Militärdienst einziehen. Wir könnten die Dinge so belassen, wie sie sind, und lediglich die Ressourcen und die industrielle Kapazität der Region nutzen, oder wir könnten den Integrationsprozess einleiten, damit sie schließlich zu einem vollwertigen Teil unseres Landes werden. Wenn wir uns für die Integration der Region entscheiden, müssten wir einige Ressourcen für diesen Prozess bereitstellen, und unsere Verwaltungskapazitäten würden dadurch belastet, aber am Ende könnte sich das alles lohnen."
HUN_territorial_policy_desc:0	 "Sobald wir das im Vertrag von Trianon verlorene Land zurückerobert haben, müssen wir entscheiden, was wir damit tun. Wenn wir wollen, dass es vollständig Teil unseres Landes wird, müssen wir Schritte zu seiner Integration unternehmen." \n Ein Staat, der §Y[?HUN.hun_claim_value]§! §CEinhaltung§! wird es uns ermöglichen, einen Anspruch darauf geltend zu machen\n Ein Staat, der §Y[?HUN.hun_core_value]§! |___CC00633 2___|Einhaltung§! ermöglicht es uns, es zu nutzen "
