DESIGNER_MAIN_COLUMN_TITLE:2	"Kampfbataillone sind Ihre Fronttruppen. \n\nJede Spalte entspricht einem Regiment eines bestimmten Basistyps wie §YPanzer§!, §YInfanterie§! oder |___CC00 5626___|Motorisierte Truppen§!. \n§Y3 Bataillone§! bilden ein §RRegiment§!\n§Y1 Regiment§! kann maximal §Y5 Bataillone§! umfassen. \n§Y2 Regimenter§! bilden eine §RBrigade§!\n§Y3 oder mehr Reg §! bilden eine §RDivision§!.\nDer oberste Typ bestimmt, was Sie sonst noch in diese Regimentsspalte eintragen können. Je mehr Kampfkompanien Sie haben, desto größer ist Ihre §YKampfbreite§! und desto weniger dieser Divisionen können Sie in dieselbe Schlacht einbinden."
