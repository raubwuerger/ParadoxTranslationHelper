league.50.desc:0	"Mit der Kriegserklärung an [?global.LoN_defender_country.GetNameDef] durch [?global.LoN_attacker_country.GetNameDef] ist der Völkerbund bei seinen Bemühungen um die Wahrung des Friedens gescheitert. [?global.LoN_attacker_country.GetLeader] verspottete offen die Unfähigkeit des Völkerbundes, etwas zu unternehmen, und schied damit |___NS000832 ___| das Land aus dem Völkerbund. Da auch andere Staats- und Regierungschefs den Sinn des Völkerbundes in Frage stellen, wenn er Konflikte nicht verhindern kann, sind die Tage des Völkerbundes de facto gezählt. \nZwar tagt der Rat weiterhin, doch -niemand mehr, dass er tatsächlich etwas bewirken könnte. Welche Autorität der Rat auch immer einst hatte, sie ist längst verloren."
