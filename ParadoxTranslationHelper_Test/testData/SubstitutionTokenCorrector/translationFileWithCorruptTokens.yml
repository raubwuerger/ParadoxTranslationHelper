##### |___KY007049 ___|„Die Entwicklung der elektrischen Kommunikation, insbesondere über große Entfernungen, hat in Australien im letzten Jahrzehnt außerordentlich rasante Fortschritte gemacht, und das letzte Glied in der Kette der landesweiten Telefonkommunikation wurde kürzlich durch die Verlegung des Unterseetelefonkabels zwischen Victoria und Tasmanien geschlossen. Zwischen allen wichtigen Zentren ist nun eine Kette hochwertiger Telefonverbindungen entstanden, und man kann sagen, dass fast jeder im Commonwealth relativ problemlos jeden anderen anrufen kann, während durch die Übersee-Funkverbindungen nach Großbritannien, Neuseeland und Java auch Kontakt zur Mehrheit der Länder der Welt hergestellt wurde.“
pride.1.d:0	"Der Stolz der $FROMCOUNTRY_ADJ$ Marine, die gefürchtete $PRIDE_SUNK$, wurde von der glorreichen $PRIDE_SINKER$ versenkt! Dies ist ein Schlag für |___NE0004 63___| Moral und ein Aufschwung für unsere eigene."
germany.370.desc:0	"Die Deutschen haben unsere berechtigten Forderungen, uns einen Platz am Verhandlungstisch für Polen einzuräumen, zurückgewiesen und uns stattdessen im Gegenzug bedroht! \n\nTatsächlich hat ihre Delegation schmerzlich deutlich gemacht, dass Deutschland möglicherweise drastische Maßnahmen ergreifen muss, sollten wir die Achsenmächte verlassen. |___NL0005 27___|\nWir sollten uns keine Illusionen darüber machen, welche Art von "drastischen Maßnahmen" Berlin im Sinn hat. Wir müssen auf einen künftigen Konflikt mit Deutschland vorbereitet sein, sollten wir unsere Drohung wahr machen. Doch vielleicht ist es an der Zeit, eine Entscheidung zu treffen, und dies könnte unsere beste Chance sein, unser Schicksal selbst in die Hand zu nehmen – mit oder ohne die Deutschen."
germany.607.desc:0	"Die 7. Panzer-Division war eine Panzerformation der deutschen Wehrmacht im Zweiten Weltkrieg. Sie nahm an der Schlacht um Frankreich, dem Einmarsch in die Sowjetunion, der Besetzung von Vichy-Frankreich sowie an der Ostfront bis zum Kriegsende. Die 7. Panzerdivision ist manchmal unter ihrem Spitznamen "§CGeisterdivision§!" bekannt.\nDie Division erzielte 1940 in Frankreich große Erfolge und anschließend erneut in der Sowjetunion im Jahr 1941. Im Mai 1942 wurde die Division aus der Sowjetunion abgezogen und nach Frankreich zurückgeschickt, um Verluste auszugleichen und sich neu zu formieren. Nach der Niederlage bei Stalingrad kehrte sie nach Südrussland zurück und trug als Teil der Heeresgruppe Don in einer Reihe von Verteidigungsschlachten dazu bei, einen allgemeinen Zusammenbruch der Front aufzuhalten; zudem nahm sie an General Erich von Mansteins Gegenangriff bei Charkow teil. Die Division kämpfte im Sommer 1943 in der erfolglosen Offensive bei Kursk, erlitt dabei schwere Verluste an Personal und Ausrüstung und wurde in der anschließenden sowjetischen Gegenoffensive weiter geschwächt.|___NL0 00550___|In den Jahren 1944 und 1945 war die Division deutlich unterbesetzt und ständig in eine Reihe von Verteidigungsschlachten an der Ostfront verwickelt. Sie wurde zweimal auf dem Seeweg evakuiert, wobei sie jedes Mal die Reste ihrer schweren Ausrüstung zurücklassen musste. Nach Verteidigungskämpfen in Preußen und Norddeutschland flohen die überlebenden Soldaten in den Wald und ergaben sich im Mai 1945 nordwestlich von Berlin der britischen Armee."
engpolitical.1.d:0	"Der National Registration Act von 1939 war ein Gesetz des britischen Parlaments. Der ursprüngliche Entwurf des National Registration Bill wurde dem Parlament zu Beginn des Zweiten Weltkriegs als Notfallmaßnahme vorgelegt. Die königliche Zustimmung erfolgte am 5. September 1939.\n\nDas Gesetz führte ein nationales Register ein, das am 29. September 1939 (National Registration Day) in Kraft trat, sowie ein System von Personalausweisen und die Verpflichtung, diese auf Verlangen vorzuzeigen oder innerhalb von 48 Stunden bei einer Polizeidienststelle vorzulegen. |___NL00057 2___|\nDrei Hauptgründe für ihre Einführung:\n\n1. Die durch Mobilmachung und Massenevakuierung verursachten massiven Bevölkerungsverschiebungen sowie die kriegsbedingte Notwendigkeit einer vollständigen Kontrolle und Planung der Arbeitskräfte, um die Effizienz der Kriegswirtschaft zu maximieren. \n\n2. Die Wahrscheinlichkeit von Rationierungen (eingeführt ab Januar 1940) .\n\n3. Bevölkerungsstatistiken. Da die letzte Volkszählung im Jahr 1931 stattgefunden hatte, gab es kaum genaue Daten, auf denen wichtige Planungsentscheidungen basieren konnten. Das Volksregister war faktisch eine Sofortvolkszählung, und das Volksregistrierungsgesetz ähnelt in vielerlei Hinsicht dem Volkszählungsgesetz von 1920."
##### |___KY0077 10___|„Entscheiden wir uns für das Projekt 1058.1“
soviet.1012.d:0	"Am 15. Mai 1937 wurde Marschall Tuchatschowskis langjähriger Kollege Boris Feldman verhaftet. Feldman hatte, ebenso wie Ilja Garkavyi vor zwei Monaten, schnell gestanden, Mitglied der von Tuchatschewski angeführten trotzkistischen Militärorganisation zu sein.\nAngesichts der Geständnisse von Garkavyi und Feldman mussten auch Putna und Primakow nachgeben.|___NL00 0587___|Am 22. Mai 1937 wurde Michail Tuchatschewski, der neu ernannte Befehlshaber des Wolga-Militärbezirks, bei seiner Ankunft in der Bezirkshauptstadt Kujbyschew verhaftet. \n\nTuchatschewskis Komplizen – der Kommandeur des Militärbezirks Weißrussland, Ieronim Uborewitsch, der Kommandeur des Militärbezirks Kiew, Iona Jakir, der Leiter der Frunse-Militärakademie, August Kork, sowie der Leiter der Militärwissenschaftlichen Gesellschaft OSOAVIAKHIM, Robert Eideman – wurden ebenfalls verhaftet. \nDer engste Freund des Marschalls und Leiter der Politischen Direktion der Roten Armee, Jan Gamarnik, hatte am 31. Mai Selbstmord begangen."
