SOV_border_incident_defender_warning.1.desc:0	"Gestern früh wurden [From.GetAdjective] Soldaten gesichtet, die die Grenze von [?JAP.JAP_attacker_state.GetName] nach |___NS0 00837___|. In der Nacht sind weitere [FROM.GetAdjective] Truppen in das Gebiet eingedrungen und haben Verteidigungsstellungen auf unserem Territorium errichtet. \n\nDies folgt auf eine Reihe kleinerer Gefechte und Grenzverletzungen durch Truppen unter dem Kommando von [FROM.GetLeader] entlang unserer gesamten gemeinsamen Grenze.\n\nDiesmal ist jedoch klar, dass die [FROM.GetAdjective]-Truppen hier bleiben werden. Wir müssen so schnell wie möglich Truppen in die Region entsenden, um ihren Vormarsch aufzuhalten."
