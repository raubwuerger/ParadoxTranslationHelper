##### |___KY0 18397___|„38M ReVA“
##### |___KY020 792___|„Westland Welkin“
GER_handheld_at_equipment_0_desc:0	" Die Entwicklung deutscher Panzerabwehrgewehre begann 1917, wobei das Mauser 1918 T-Gewehr das weltweit erste Panzerabwehrgewehr war. Die Entwicklung von Panzerabwehrgewehren wurde im Zuge der deutschen Wiederaufrüstung Ende der 1930er Jahre wieder aufgenommen. Im Jahr 1939 entwickelte der Konstrukteur B. Brauer bei den Gustloff Werken die Panzerbüchse 38 (PzB 38). \n\nDie PzB 38 war eine manuell geladene Einzelladerwaffe mit rückstoßbehaftetem Lauf. Sie verwendete eine speziell entwickelte Patrone mit einem Standardkaliber von 7,9 mm, jedoch einer sehr großen, 94 mm langen Hülse, die als 7,92x94-mm-Patrone bezeichnet wurde. Beim Abfeuern bewegte sich der Lauf etwa 9 cm zurück, wodurch sich der Verschluss öffnete und die verbrauchte Patronenhülse ausgeworfen wurde. Der Verschlussblock wurde daraufhin in der hinteren Position arretiert und blieb geöffnet, damit der Schütze manuell eine neue Patrone einlegen konnte. Anschließend löste der Schütze den gespannten Verschluss mit einem Hebel am Griff aus. Verschluss und Lauf bewegten sich daraufhin wieder nach vorne, und der Abzug wurde zur Vorbereitung des Schusses gespannt. Dieser recht komplizierte Mechanismus neigte Berichten zufolge zu Ladehemmungen, da das System im Feldeinsatz verschmutzte. \n|___ NL002680___|Obwohl aus gepressten und punktgeschweißten Stahlteilen gefertigt, war die Herstellung aufgrund des komplizierten vertikalen Verschlussmechanismus schwierig, sodass nur eine geringe Anzahl von (1.408) PzB-38-Gewehre zwischen 1939 und 1940 im Werk Gustloff Werke hergestellt. 62 dieser Waffen wurden von deutschen Truppen beim Einmarsch in Polen im Jahr 1939 eingesetzt."
GER_HMG_equipment_2_desc:0	"Das Maschinengewehr 42 (abgekürzt MG 42) ist ein deutsches Maschinengewehr, das 1942 von Dr. Werner Gruner von der Großfuß AG entwickelt wurde. Während das frühere MG 34 ein erfolgreiches Design war, erforderten seine hohen Materialkosten und die Komplexität der Konstruktion im Verlauf des Krieges eine neuere Konstruktion, da die deutsche Kriegsindustrie an ihre Grenzen stieß. \n\nUnter den drei Unternehmen, die zur Einreichung von Entwürfen aufgefordert wurden, erwies sich der Entwurf der Großfuß AG als der mit Abstand beste. Die Konstruktion nutzte einen einzigartigen, rückstoßbetriebenen Rollverschlussmechanismus, während die anderen Entwürfe ein gasbetätigtes System verwendeten. Interessanterweise verfügte das Unternehmen über keinerlei vorherige Erfahrung in der Waffenherstellung, sondern auf gepresste und gestanzte Stahlkomponenten spezialisiert war. Dr. Werner Gruner, einer der führenden Konstrukteure bei Großfuß, wusste nichts über Maschinengewehre, als er mit der Mitarbeit an dem Projekt betraut wurde, obwohl er auf die Technologie der Massenproduktion spezialisiert war. Gruner besuchte einen Maschinengewehrkurs der Armee, um sich mit dem Nutzen und den Eigenschaften einer solchen Waffe vertraut zu machen, und holte sich Anregungen von Soldaten. \n|___NL0 02706___|Da das MG 42 größtenteils aus gestanztem, entsprechend gehärtetem Kohlenstoffstahl gefertigt wurde, erforderte es deutlich weniger maschinelle Bearbeitung und weniger hochwertige Stahllegierungen, die Metalle enthielten, die in Deutschland knapp geworden waren. Das MG 42 war wesentlich einfacher zu fertigen als andere Maschinengewehre – die Fertigstellung des neuen Gewehrs erforderte 75 Arbeitsstunden gegenüber 150 Arbeitsstunden für das MG 34 (eine Reduzierung um 50 %), 27,5 kg Rohmaterial gegenüber 49 kg für das MG 34 (eine Reduzierung um 44 %) – und kostete 250 RM gegenüber 327 RM (eine Reduzierung um 24 %). Um die Konstruktion zu vereinfachen, wurde zudem das  ...
GER_mortar_equipment_0_desc:0	"Mörser sind die wichtigste explosive Unterstützungswaffe im Zug. Wo größere Artilleriegeschütze für einen flexiblen taktischen Einsatz möglicherweise zu unhandlich sind, kann der Mörser den Soldaten in der Nähe organische Feuerunterstützung bieten. Die hohe, bogenförmige Flugbahn von Mörsergranaten macht sie ideal, um in Schützengräben einzuschlagen, die ungeschützten Dächer von Gebäuden zu treffen oder Mauern zu umgehen. \n\nDer 5-cm-leichter Granatwerfer 36 (5 cm leGrW 36) ist ein deutscher leichter Mörser, der 1934 von Rheinmetall entwickelt wurde. Die vorgesehene Aufgabe des 5 cm leGrW 36 bestand darin, Widerstandsnester zu bekämpfen, die sich außerhalb der Wurfweite einer Handgranate befanden. Die Konstruktion umfasste ein Zielfernrohr zur Erleichterung der Zielerfassung, das jedoch nach 1938 zur Vereinfachung der Produktion entfernt wurde. \n|___NL0 02714___|Bis 1941 galt der Granatwerfer 36 als zu komplex für seine vorgesehene Aufgabe. Er feuerte zu leichte Geschosse ab und hatte eine zu geringe Reichweite. Er wurde als Zugmörser eingesetzt und von einem 3-Mann-Team bedient. Die Produktion wurde 1941 eingestellt. Bis 1942 wurde er schrittweise aus dem Frontdienst abgezogen. Er blieb jedoch bis zum Ende des Zweiten Weltkriegs 1945 bei und Garnisonseinheiten bis zum Ende des Zweiten Weltkriegs im Jahr 1945 im Einsatz. \n\nBis 1943 wurden über 30.000 Einheiten und 22.000.000 5-cm-Granaten produziert."
ju_88_s_bomber_equipment_1_desc:0	" Die Junkers Ju 88 S war ein Hochgeschwindigkeitsbomber mit einer glatt verglasten Nase, die die aerodynamische Leistung des Flugzeugs steigerte. Es wurde ein GM-1-Lachgas-Boost-System eingebaut, das den Sauerstoffanteil im Kraftstoffgemisch erhöhte und zu einer besseren Leistung in großen Höhen führte. Weitere Varianten der S-Serie sollten über leistungsstärkere Triebwerke verfügen und die Bombenlast durch den Einsatz von Verlängerungen des Bombenschachts aus Holz erhöhen.\n|___ NL002745___|Aufgrund umfangreicher Änderungen können frühere Ju 88 nicht zu Ju 88 S umgerüstet werden."
he_111_bomber_equipment_5_desc:0	 "Die Heinkel He 111 P verfügte über neue, flüssigkeitsgekühlte DB 601A-1-Motoren und einen neu gestalteten Bugbereich, der die Montage eines zusätzlichen 7,92-mm-MG15 ermöglichte. Die glatte, verglaste Nase ermöglichte den Piloten eine bessere Sicht. Zu den weiteren Merkmalen gehörten ein verbessertes Funkgerät, selbstdichtende Treibstofftanks und halb einziehbare Fahrwerke zur Verringerung des Luftwiderstands.\n|___ NL002759___|Aufgrund umfangreicher Änderungen können veraltete Heinkel He 111 F nicht zu Heinkel He 111 P umgerüstet werden."
##### |___ KY023219___|„Die He 51 ist ein Doppeldecker-Kampfflugzeug.“
lockheed_p38g_equipment_1_desc:0	"Einheitentyp: Schwerer Jäger \n\n Die P-38G verfügte über Halterungen innenseitig der Triebwerke, die für zusätzliche Treibstofftanks oder zur Aufnahme von 2.000 Pfund Bomben. Um Probleme hinsichtlich Manövrierfähigkeit und Strömungsabriss zu beheben, wurden Fowler-Klappen hinzugefügt, die zur Leistungssteigerung des Flugzeugs beitrugen. Eine Hispano M2 20-mm-Kanone ersetzte die 23-mm-T1-Autokanone und erhöhte die tödliche Feuerkraft des Flugzeugs erheblich. Die P-38G wurde eingesetzt, um Admiral Yamamoto anzugreifen und zu töten.\n|___NL0028 86___|Veraltete P-38 können zu P-38G umgerüstet werden."
##### |___KY0248 12___|„Seversky A8V1“
##### |___KY024989 ___|„Dies stellt die Boote der Balao-Klasse in der GUPPY-Umrüstung dar. Die Balao-Klasse war ein erfolgreiches U-Boot-Design der United States Navy, das im Zweiten Weltkrieg eingesetzt wurde, und mit 120 fertiggestellten Einheiten die größte U-Boot-Klasse der US-Marine. Als Weiterentwicklung der früheren Gato-Klasse wiesen die Boote geringfügige interne Unterschiede auf. Die bedeutendste Verbesserung war die Verwendung von dickerem Stahl mit höherer Streckgrenze für die Außenhaut und die Spanten des Druckkörpers, wodurch ihre Testtauchtiefe auf 400 Fuß (120 m) erhöht wurde.“
